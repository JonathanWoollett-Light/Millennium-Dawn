l_english:
 portugal_focus: "Portuguese Focus Tree"

 ### POLITICS ###
 POR_a_terceira_republica: "The Third Republic"
 POR_a_terceira_republica_desc: "Twenty-six years of parliamentary government, four of them spent deciding whether we wanted it. The constitution has been revised five times and the state it describes is still the one the revolution built: large, slow, and answerable to everyone at once."
 POR_reforma_do_estado: "Reform of the State"
 POR_reforma_do_estado_desc: "Four ministries read a permit before anyone may pour concrete. We will not abolish any of them, because they cannot be abolished, but we can decide which one signs last."
 POR_combate_a_corrupcao: "Fighting Corruption"
 POR_combate_a_corrupcao_desc: "Nobody in Lisbon takes envelopes. They take seats on boards, consultancies for their brothers-in-law, and planning decisions in the district where they were born. It is not theft and it costs us more than theft would."
 POR_o_tribunal_de_contas: "The Court of Auditors"
 POR_o_tribunal_de_contas_desc: "A court that can stop a contract before the money moves rather than write a report about it afterwards. Every government since the revolution has promised this and every one of them discovered a reason to wait."
 POR_educacao_para_todos: "Education for All"
 POR_educacao_para_todos_desc: "A fifth of the country cannot read a contract it is asked to sign. That is the real ceiling on what our economy can make, and it will take a generation to lift."
 POR_o_recenseamento_da_diaspora: "The Diaspora Census"
 POR_o_recenseamento_da_diaspora_desc: "There are more Portuguese outside Portugal than in half our districts. Until now nobody in Lisbon could say how many, where, or what they were worth to us. A consulate that knows its community is an instrument."

 POR_road_ps_tt: "The §YSocialist Party§! is in government"
 POR_road_psd_tt: "The §YSocial Democrats§! are in government"
 POR_road_left_tt: "The §Yradical left§! is in government"
 POR_road_national_tt: "The §Ynational right§! is in government"
 POR_a_causa_real_tt: "Monarchist support is above §Y15%%§!"

 ### CHARACTERS ###
 POR_jorge_silva_carvalho: "Jorge Silva Carvalho"
 POR_carlos_alberto_lopes: "Carlos Alberto Lopes"

 ### THE PARTY ROADS ###
 POR_o_ciclo_politico: "The Political Cycle"
 POR_o_ciclo_politico_desc: "Two parties have alternated in government since the revolution, and the country has learned to read an election as a change of personnel rather than of direction. Whoever holds the Assembly now can do rather more than that."
 POR_o_bloco_central: "The Central Bloc"
 POR_o_bloco_central_desc: "Socialists and social democrats governing together, which is either a national emergency measure or an admission that the two of them were never very far apart."
 POR_o_estado_social: "The Social State"
 POR_o_estado_social_desc: "The health service and the pension system were the revolution's real achievement and are the most expensive thing the state does. Defending them is what the party is for."
 POR_a_geringonca: "The Contraption"
 POR_a_geringonca_desc: "A minority government supported from outside by the communists and the left bloc, an arrangement its opponents named after a rickety machine and its authors were happy to keep the name for.\n\nIt should not work. It does."
 POR_a_alternancia: "Alternation"
 POR_a_alternancia_desc: "The social democrats return, as they always do, on the argument that the other lot cannot count. What they do with the office is the only question that matters."
 POR_o_choque_fiscal: "The Fiscal Shock"
 POR_o_choque_fiscal_desc: "Corporate tax comes down and the state stops pretending it can pick winners. Firms that were waiting for a reason to invest are given one."
 POR_a_coligacao_democratica: "The Democratic Coalition"
 POR_a_coligacao_democratica_desc: "The social democrats and the Christian democrats govern together, which gives the government a majority and the junior partner a permanent grievance."
 POR_a_frente_de_esquerda: "The Left Front"
 POR_a_frente_de_esquerda_desc: "The communists never went away and the left bloc has spent a decade assembling everyone who found the party too old and the socialists too comfortable. Together they are a government."
 POR_auditoria_a_divida: "Audit the Debt"
 POR_auditoria_a_divida_desc: "A public commission to establish which of our obligations were incurred legitimately and which were not. The answer is largely known in advance; the point is to have it said out loud before we act on it."
 POR_nacionalizacoes_estrategicas: "Strategic Nationalizations"
 POR_nacionalizacoes_estrategicas_desc: "Energy, water and the banks return to public hands. Whatever it does to the country's reputation among investors, it settles the question of who the utilities answer to."
 POR_a_reaccao_nacional: "The National Reaction"
 POR_a_reaccao_nacional_desc: "A politics that was unsayable for a generation is being said again, in public, by people with seats. The question is whether the parties of government intend to compete for those voters or to govern without them."
 POR_a_lei_da_ordem: "Law and Order"
 POR_a_lei_da_ordem_desc: "More police, faster courts and an interior ministry that answers questions from nobody. It is popular, it works, and it is very difficult to give back."
 POR_a_causa_real: "The Royal Cause"
 POR_a_causa_real_desc: "The House of Braganza never abdicated and never stopped being asked to. Duarte Pio has spent his life at the edge of national life, saying nothing that could be held against him, which in a republic this tired is a qualification.\n\nA crown would settle the question of who the state belongs to, and it would settle it against the Assembly."

 ### ECONOMY ###
 POR_o_programa_de_convergencia: "The Convergence Program"
 POR_o_programa_de_convergencia_desc: "Brussels sets the deficit target and we write the budget that meets it. Convergence is the polite word for spending the next decade catching up to countries that were never behind."
 POR_o_euro_e_a_divida: "The Euro and the Debt"
 POR_o_euro_e_a_divida_desc: "We borrowed at German rates against Portuguese growth, and the difference has been accumulating quietly since the day we joined. There is no devaluation available to us now. There is only the arithmetic."
 POR_a_reestruturacao_da_divida: "Debt Restructuring"
 POR_a_reestruturacao_da_divida_desc: "We go to our creditors, we open the books, and we pay for the privilege of being believed. It is expensive, it is humiliating, and it works."
 POR_a_alternativa_soberana: "The Sovereign Alternative"
 POR_a_alternativa_soberana_desc: "We stop servicing the debt on the schedule our creditors prefer and start servicing it on ours. The markets will have opinions about this, and we will pay for those opinions for years."
 POR_o_regresso_aos_mercados: "Return to the Markets"
 POR_o_regresso_aos_mercados_desc: "The first auction after a restructuring is the only one that matters. If it clears, the thing is over. If it does not, nothing else we have done counts for anything."
 POR_a_reindustrializacao: "Reindustrialization"
 POR_a_reindustrializacao_desc: "We cannot win on wages against countries with none, so we will stop trying. What we can sell is precision, moulds, components and the people who know how to make them."
 POR_a_web_summit: "The Web Summit"
 POR_a_web_summit_desc: "Seventy thousand people in Parque das Nacoes for a week, and a standing argument about whether it is worth what we pay for it. What it actually buys is the first generation in living memory with a reason to stay."
 POR_portugal_2030: "Portugal 2030"
 POR_portugal_2030_desc: "The last European framework we will spend as a net recipient. Whatever the country is going to be, it has to be built with this money, because there will not be another round of it."

 ### THE LUSOPHONE WORLD ###
 POR_a_comunidade_lusofona: "The Lusophone Community"
 POR_a_comunidade_lusofona_desc: "Eight countries, four continents, two hundred and fifty million speakers and no institution worth the name. Everyone involved agrees something should be built. Only we have a reason to build it."
 POR_o_instituto_camoes: "The Camoes Institute"
 POR_o_instituto_camoes_desc: "Language schools, teacher exchanges, a seat at every ministry of education from Praia to Dili. The cheapest instrument of foreign policy ever devised, and the only one nobody objects to."
 POR_a_realpolitik_lusofona: "Lusophone Realpolitik"
 POR_a_realpolitik_lusofona_desc: "The community of language is real and it is also a map of where we are already trusted. A government that is trusted in eight capitals can do things in those capitals that nobody else can.\n\nWe will stop pretending that is sentiment."
 POR_os_amigos_do_regime: "Friends of the Regime"
 POR_os_amigos_do_regime_desc: "A retainer for the minister's brother, a scholarship for the general's daughter, a directorship for the man who runs the port. None of it is illegal in any of the countries concerned, which is the point of doing it that way."
 POR_a_rede_de_oficiais: "The Officer Network"
 POR_a_rede_de_oficiais_desc: "Every officer corps in the Lusophone world was trained in a language we gave them, and a good number of them at our academies. Men who studied together stay in touch, and men who stay in touch can be reached."
 POR_a_via_discreta: "The Discreet Road"
 POR_a_via_discreta_desc: "Nothing is signed, nothing is announced and no Portuguese uniform is ever photographed. What we do will still be obvious to anyone who looks, and the whole art is in making sure nobody has to."
 POR_a_via_aberta: "The Open Road"
 POR_a_via_aberta_desc: "We stop apologising for having interests. A country that says plainly what it wants in Africa will be believed there, and will be resented everywhere else."
 POR_a_legiao_portuguesa: "The Portuguese Legion"
 POR_a_legiao_portuguesa_desc: "A standing pool of officers and volunteers held apart from the regular establishment. They are not an expeditionary force and must never be described as one; they are men available to go somewhere difficult at short notice."
 POR_o_pronunciamento: "The Pronunciamento"
 POR_o_pronunciamento_desc: "The Iberian tradition is not the coup but the pronouncement: officers who declare what the nation requires and wait to be agreed with. It has worked twice in our own history and we have taught it to every army that speaks our language."
 POR_a_escola_de_guerra_de_africa: "The African War School"
 POR_a_escola_de_guerra_de_africa_desc: "Thirteen years of colonial war taught this army things no other European army learned, and we spent twenty-five years forgetting them. The men who remember are still alive, and they can still teach."
 POR_a_projeccao_de_forcas: "Force Projection"
 POR_a_projeccao_de_forcas_desc: "Transport aircraft, a logistics chain that does not depend on the goodwill of a neighbouring government, and the legal authority to use both without a debate in the Assembly."
 POR_a_segunda_vaga: "The Second Wave"
 POR_a_segunda_vaga_desc: "One operation at a time is a policy. Two is an empire, and the difference is entirely in what our own services can carry without losing track of it."
 POR_estagio_needs_a_war_tt: "Portuguese forces are §Ydeployed overseas§!"
 POR_a_saida_atlantica_tt: "Our exposure is above §Y35§!"
 POR_o_imperio_informal_tt: "We have at least §Y1§! Lusophone client government"
 POR_a_segunda_vaga_tt: "We may sponsor §Y1§! additional operation at a time"
 POR_a_questao_europeia: "The European Question"
 POR_a_questao_europeia_desc: "Everything we do overseas is done by a member state of the European Union, and sooner or later somebody in Brussels will ask what exactly we are doing. We should decide now what we intend to say."
 POR_permanecer_na_europa: "Remain in Europe"
 POR_permanecer_na_europa_desc: "We stand the operations down, we let the files go cold, and we keep the seat, the fund transfers and the currency. What we have already built stays built; what we were going to build next does not."
 POR_permanecer_na_europa_tt: "We may no longer begin new §Roperations§!. Countries already ours §Gremain§! ours."
 POR_a_saida_atlantica: "The Atlantic Exit"
 POR_a_saida_atlantica_desc: "A country with an ocean, eight relationships nobody else has, and no further use for permission. We leave the alliance, we accept what that does to us in Europe, and we stop explaining ourselves."
 POR_o_imperio_informal: "The Informal Empire"
 POR_o_imperio_informal_desc: "No governors, no garrisons and no colonial budget. Governments that owe us their existence, sign what we put in front of them, and are answerable to their own electorates for everything that goes wrong.\n\nThe Estado Novo spent a generation of conscripts learning that the other way does not work."

 ### SHADOW OPERATIONS ###
 POR_shadow_ops_category: "Lusophone Operations"
 POR_escola_ultramar_category: "The Overseas War School"
 POR_cultivar_a_rede: "Cultivate the Network"
 POR_cultivar_a_rede_desc: "A retainer here, a scholarship there, a seat on a board for a minister's brother. None of it is illegal and all of it is remembered."
 POR_cultivar_a_rede_tt: "Costs §Y1.50§! billion"
 POR_armar_os_nossos: "Arm Our Friends"
 POR_armar_os_nossos_desc: "The crates leave Setubal marked as agricultural machinery and arrive as what they are. We send no Portuguese with them, which is the entire point."
 POR_armar_os_nossos_tt: "Costs §Y1.00§! billion"
 POR_comprar_os_generais: "Buy the Officer Corps"
 POR_comprar_os_generais_desc: "Colonels are cheaper than wars. The ones we pay decide whether a rebellion has an army behind it or only a grievance, and they are the hardest thing we do to keep quiet."
 POR_comprar_os_generais_tt: "Costs §Y2.00§! billion"
 POR_desactivar_o_dossie: "Burn the Dossier"
 POR_desactivar_o_dossie_desc: "Our people come home, the accounts close and the file goes into a stove in Belem. We lose the country and we buy back the quiet."
 POR_estagio_na_selva: "Jungle Tour"
 POR_estagio_na_selva_desc: "An officer attached to a war we are already standing in, where the fighting is in the bush and nothing arrives on time. He comes back changed, or he comes back having learned nothing."
 POR_estagio_na_floresta: "Bush War Tour"
 POR_estagio_na_floresta_desc: "The wars in Angola and Mozambique are fought in forest and scrub against an enemy who never forms a line. There is no way to teach that at Amadora."
 POR_estagio_tt: "Costs §Y1.50§! billion"

 POR_o_pronunciamento_local: "The Pronunciamento"
 POR_o_pronunciamento_local_desc: "The colonels we have been paying will move against their government. Everything we have built in that country is spent at once, and for forty-five days it is still possible for someone in the capital to notice."
 POR_o_pronunciamento_local_tt: "Costs §Y6.00§! billion"
 POR_pronunciamento_aborted_tt: "The rising did §Rnot§! take place. Events overtook it."

 ### THE TIMELINE ###
 portugal.6.t: "The Men from the Troika"
 portugal.6.d: "The rates we borrow at have passed the point where borrowing is possible, and three institutions have arrived in Lisbon with a programme already written. The money is real. So is the list of what we will do to get it: wages, pensions, the health service, the labour code, and a schedule of privatisations somebody else drew up.\n\nThe alternative is to find the money ourselves, from a market that has already decided what it thinks of us."
 portugal.6.a: "Sign the memorandum"
 portugal.6.b: "We will manage alone"
 portugal.11.t: "Timor Is Independent"
 portugal.11.d: "At midnight the flag went up in Dili and a country we governed for four hundred years, abandoned in 1975 and occupied for twenty-four, became independent. Portuguese is one of its two official languages, largely because the generation that fought the occupation chose it as the language the occupiers could not read.\n\nWe owe them something. What we do about it is a question of how we intend to be owed things by other people."
 portugal.11.a: "The obligation does not end with the flag"
 portugal.11.b: "They are a country now"
 portugal.13.t: "The Colonels in Sao Tome"
 portugal.13.d: "The army has taken the presidential palace while the president was abroad, and the officers holding it have issued the usual list of grievances about pay, corruption and the oil contracts. Nigeria is already offering to mediate.\n\nWe are the former metropole, we are owed a hearing, and nobody else in that palace speaks to Lisbon before they speak to anyone."
 portugal.13.a: "Mediate, and be seen to"
 portugal.13.b: "Deal with whoever holds the palace"

 ### EVENTS ###
 portugal.20.t: "Disquiet in the Officer Corps"
 portugal.20.d: "Something is moving in the garrisons. Officers who have never had money are spending it, the same three colonels are meeting at the same house, and the reports from the interior have stopped arriving. There is a Portuguese name attached to all of it, and no proof of anything.\n\nWe can break up the officer corps now and accept what that does to the army, or we can decide that a country cannot be governed on rumour."
 portugal.20.a: "Purge the officer corps"
 portugal.20.b: "We do not govern on rumour"
 portugal.31.t: "The Rising"
 portugal.31.d: "It began before dawn. The barracks declared first, the radio station an hour later, and by the time the ministries understood what was happening the colonels were reading a proclamation over the air.\n\nNo Portuguese soldier is within a thousand kilometres of it. Every rifle in the hands of the men reading that proclamation came out of a warehouse in Setubal, and every colonel holding the capital has been on a Portuguese retainer for years."
 portugal.31.a: "They are ours"
 portugal.32.t: "A Friendly Government"
 portugal.32.d: "The war is over and our people are in the ministries. What we have is not a colony and could not survive being called one: it is a government that owes us its existence, signs what we put in front of it, and will go on doing so exactly as long as that arrangement suits both of us.\n\nThe Estado Novo spent thirteen years and a generation of conscripts trying to hold this country. We have it back for the price of a few colonels."
 portugal.32.a: "The empire was always a commercial proposition"
 portugal.34.t: "Our People Are Dead"
 portugal.34.d: "The government we tried to unseat is still there, and it has spent the last week hanging the officers we paid. The survivors have named us, at length, in front of cameras.\n\nThere is no denying this one. The only question is how much of it reaches Brussels."
 portugal.34.a: "Burn the files"
 portugal_news.1.t: "Officers Declare Against Their Government"
 portugal_news.1.d: "Army officers have declared against their government, seizing the capital's radio station and several garrison towns overnight. The rebels have announced a provisional administration and appealed for international recognition.\n\nThe government has accused unnamed foreign interests of financing the rising."
 portugal_news.1.a: "Another African war"
 portugal_news.2.t: "The Rebels Take Power"
 portugal_news.2.d: "The civil war has ended with the rebel administration in control of the capital and the outgoing government in exile. The new government has moved quickly to normalise relations with Lisbon, where officials describe the outcome as a matter for that country's citizens alone."
 portugal_news.2.a: "A matter for them alone"

 ### DYNAMIC MODIFIERS ###
 POR_economy_modifier: "The Portuguese Economy"
 POR_economy_modifier_desc: "The running ledger of what our economic program has done to output, credit and the cost of borrowing."
 POR_military_modifier: "The Portuguese Armed Forces"
 POR_military_modifier_desc: "The running ledger of the reforms, procurement and overseas commitments the armed forces have absorbed."
 POR_political_modifier: "The Portuguese Republic"
 POR_political_modifier_desc: "The running ledger of how the state governs itself, and of how much of the political nation it carries with it."
 POR_shadow_network: "The Lusophone Network"
 POR_shadow_network_desc: "Chambers of commerce, seminaries, staff colleges and the men who move between them. Nothing here appears in a treaty, and all of it shortens the distance between Lisbon and a decision taken overseas."
 POR_doutrina_ultramarina: "Overseas Doctrine"
 POR_doutrina_ultramarina_desc: "Officers who have fought in the bush teach the ones who have not. The doctrine only advances while the wars are running, and it fades once our people come home."
 POR_intervencao_ultramarina: "The Weight of Distance"
 POR_intervencao_ultramarina_desc: "Every drum of fuel and every crate of ammunition reaches the theatre by sea, six thousand kilometres from the nearest Portuguese depot, and a good part of what is landed is stolen, sold at the roadside or written off before it reaches anyone who intended to fire it. The heavier the force we send, the more of it evaporates on the way.\n§W--------------§!\nThis modifier will be §RRemoved§! when Portuguese volunteers are no longer deployed abroad."
 POR_eu_exposure_modifier: "Under Investigation"
 POR_eu_exposure_modifier_desc: "Brussels has noticed. What began as questions from the Commission about our overseas dealings becomes, at length, a question about our standing in the Union.\n§W--------------§!\nThis modifier will be §RRemoved§! if our exposure falls below §Y15§!."

 ### NATIONAL SPIRITS ###
 POR_a_divida_publica_1: "The Public Debt"
 POR_a_divida_publica_1_desc: "We joined the single currency on the strength of cheap credit, and we have spent a decade borrowing against a growth rate we never achieved. Every escudo of the old debt is now denominated in a currency we cannot devalue.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$POR_o_euro_e_a_divida$§! focus, and again with the §Y$POR_a_reestruturacao_da_divida$§! or §Y$POR_a_alternativa_soberana$§! focus. It will be §RRemoved§! if we complete the §Y$POR_o_regresso_aos_mercados$§! focus."
 POR_a_economia_de_baixo_valor_1: "An Economy of Low Value"
 POR_a_economia_de_baixo_valor_1_desc: "Textiles, footwear and assembly work built the republic we have, and none of it survives contact with cheaper labour elsewhere. Our firms compete on price because we have given them nothing else to compete on.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$POR_educacao_para_todos$§! focus, and again with the §Y$POR_a_reindustrializacao$§! focus. It will be §RRemoved§! if we complete the §Y$POR_portugal_2030$§! focus."
 POR_o_estado_pesado_1: "The Heavy State"
 POR_o_estado_pesado_1_desc: "Four ministries will read a permit before anyone may pour concrete, and each of them answers to a different party. The administration is not corrupt so much as it is slow, and slowness has a price that is paid in contracts awarded to whoever waited longest.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$POR_reforma_do_estado$§! focus, and again with the §Y$POR_combate_a_corrupcao$§! focus. It will be §RRemoved§! if we complete the §Y$POR_o_tribunal_de_contas$§! focus."
 POR_a_emigracao_1: "A Nation That Leaves"
 POR_a_emigracao_1_desc: "There are Portuguese communities in Paris, Toronto, Caracas and Johannesburg larger than most of our districts. They send money home and they do not come back, and the villages they left are older every year. What we lose in people we keep in reach.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$POR_o_recenseamento_da_diaspora$§! focus. It will be §RRemoved§! if we complete the §Y$POR_a_web_summit$§! focus."
 POR_o_fim_do_imperio: "The End of Empire"
 POR_o_fim_do_imperio_desc: "For five hundred years this was a small country with a very long reach, and for twenty-six years it has been a small country. The language remains, the companies remain, the families remain. Only the authority is gone.\n§W--------------§!\nThis national spirit will be §RRemoved§! and replaced by the §YInformal Empire§! if we complete the §Y$POR_a_realpolitik_lusofona$§! focus."
 POR_o_imperio_informal_idea: "The Informal Empire"
 POR_o_imperio_informal_idea_desc: "We no longer govern anything overseas. We do not need to. A shared language, a shared church, a shared officer class and the banks that clear their trade will carry an instruction further than a governor ever did."
 POR_o_quinto_imperio_idea: "The Fifth Empire"
 POR_o_quinto_imperio_idea_desc: "Vieira promised a fifth empire after Assyria, Persia, Greece and Rome, and Pessoa promised it again in verse. Neither of them expected it to be assembled out of mining concessions, military missions and a currency board, but it is being assembled."

 ### THE PORTUGUESE LEGION ###
 POR_idea_legiao_portuguesa_1: "The Portuguese Legion"
 POR_idea_legiao_portuguesa_1_desc: "A standing pool of officers and volunteers, kept apart from the regular establishment and paid from a budget line nobody reads aloud. They train for somewhere hot, far away, and legally ambiguous."

 ### THE CLIENT LADDER ###
 POR_presenca_lusofona_1: "Portuguese Presence"
 POR_presenca_lusofona_1_desc: "Portuguese firms hold the shipping agency, the telephone concession and the cement works. Portuguese officers sit in on the planning. Nothing about this arrangement appears in a treaty, and everything about it appears in the trade figures."

 ### THE ARMED FORCES ###
 POR_as_forcas_armadas: "The Armed Forces"
 POR_as_forcas_armadas_desc: "Three services shaped by thirteen years of colonial war and twenty-five years of forgetting it. The equipment is old, the experience is real, and nobody in the general staff has planned for a European battlefield in their working life."
 POR_a_profissionalizacao: "The End of Conscription"
 POR_a_profissionalizacao_desc: "The last conscript class leaves and is not replaced. A volunteer army is smaller, better and considerably more willing to go somewhere far away without a national debate about it."
 POR_a_brigada_mecanizada: "The Mechanized Brigade"
 POR_a_brigada_mecanizada_desc: "Santa Margarida holds the only formation we have that could fight a conventional enemy, and it is equipped with vehicles older than the men driving them."
 POR_o_leopard_2a6: "The Leopard 2A6"
 POR_o_leopard_2a6_desc: "Thirty-seven tanks from Dutch surplus, which is both a serious capability and an admission about how we intend to acquire equipment from now on."
 POR_a_brigada_de_reaccao_rapida: "The Rapid Reaction Brigade"
 POR_a_brigada_de_reaccao_rapida_desc: "Paratroopers, commandos and special operations under one headquarters, kept at readiness for something nobody has yet defined. Defining it is the interesting part."
 POR_os_comandos: "The Commandos"
 POR_os_comandos_desc: "Disbanded after the revolution for what they did before it, and reformed because an army that cannot do that kind of work has to ask someone else to."
 POR_o_isaf: "Kabul and Kosovo"
 POR_o_isaf_desc: "Portuguese battalions under NATO command in places we have no interest in whatsoever. What we get out of it is an army that has been somewhere, and allies who owe us a favour they will be asked about later."
 POR_a_industria_de_defesa: "The Defense Industry"
 POR_a_industria_de_defesa_desc: "Braco de Prata, OGMA and the Alfeite yard have been kept alive on sentiment and state orders. Given real work, and real protection, they become a constituency of their own."
 POR_o_sirp: "The Intelligence System"
 POR_o_sirp_desc: "Two services, one civil and one military, and a coordinating office that exists mainly so the Assembly has somebody to question. Properly funded, it is what keeps our own affairs out of other people's files."

 ### O MAR PORTUGUES ###
 POR_o_mar_portugues: "The Portuguese Sea"
 POR_o_mar_portugues_desc: "An exclusive economic zone larger than the European Union, patrolled by a navy that can put perhaps four ships to sea at once. The sea is the one thing we have more of than anyone."
 POR_o_arsenal_do_alfeite: "The Alfeite Arsenal"
 POR_o_arsenal_do_alfeite_desc: "The yard can refit anything we own and build very little of it. That is a choice rather than a fact, and it can be unmade."
 POR_as_fragatas_bartolomeu_dias: "The Bartolomeu Dias Frigates"
 POR_as_fragatas_bartolomeu_dias_desc: "Two Karel Doorman hulls bought from the Dutch, modern enough to escort anything we might want escorted and cheap enough that the Assembly approved them without argument."
 POR_os_submarinos_tridente: "The Tridente Submarines"
 POR_os_submarinos_tridente_desc: "Two German boats, air independent, quiet, and completely disproportionate to any threat facing Portugal in European waters. They are not for European waters."
 POR_a_zona_economica_exclusiva: "The Exclusive Economic Zone"
 POR_a_zona_economica_exclusiva_desc: "Fisheries, cables, seabed minerals and the licensing of all three. The maritime industry becomes the constituency that funds the navy that protects the maritime industry."
 POR_a_base_das_lajes: "Lajes Field"
 POR_a_base_das_lajes_desc: "The Americans have used the Azores since the war and will go on paying for the privilege. An airfield in the middle of the Atlantic is worth more to a country with business on the far side of it."
 POR_a_forca_aerea: "The Air Force"
 POR_a_forca_aerea_desc: "Search and rescue, air policing, and a fighter fleet that exists to be counted by NATO. What it lacks entirely is the ability to put anything anywhere."
 POR_os_f_16_mlu: "The F-16 Mid-Life Update"
 POR_os_f_16_mlu_desc: "The airframes are sound and the electronics are twenty years old. Rebuilding them costs a fraction of replacing them and buys another twenty years."
 POR_o_kc_390: "The KC-390"
 POR_o_kc_390_desc: "A Brazilian transport with Portuguese work on the airframe, bought because it can reach Luanda and Maputo without asking anyone for a landing. Nobody says that part aloud."

 ### O QUINTO IMPERIO ###
 POR_o_quinto_imperio: "The Fifth Empire"
 POR_o_quinto_imperio_desc: "Vieira preached it from the pulpit and Pessoa wrote it into verse: after Assyria, Persia, Greece and Rome, a fifth empire, and Portuguese. Neither of them expected it to arrive as a currency board and a mining concession, but it has."
 POR_o_imperio_ultramarino: "The Overseas Empire"
 POR_o_imperio_ultramarino_desc: "We stop calling it intervention. A state with governments of its own making on three continents has interests to defend there, and the law will be written to say so."
 POR_a_conferencia_imperial: "The Imperial Conference"
 POR_a_conferencia_imperial_desc: "Every government that owes us its existence, in one room in Lisbon, asked a question none of them can answer casually: whether the arrangement they live under should have a name and a parliament."
 POR_a_conferencia_imperial_tt: "We have at least §Y2§! Lusophone client governments"
 POR_a_federacao_lusofona: "The Lusophone Federation"
 POR_a_federacao_lusofona_desc: "Those who agreed come in as provinces of a single state, with their armies, their leaders and their seats. Those who refused stay exactly as they were, which is the proof that the ones who agreed were asked.\n\n\n\nFive hundred years late, and by an entirely different route."
 POR_a_federacao_lusofona_tt: "At least §Y1§! of our subjects has §Gagreed§! to federate"
 POR_federacao_category: "The Imperial Conference"
 POR_convocar_a_conferencia: "Summon to the Conference"
 POR_convocar_a_conferencia_desc: "The invitation is not a demand. It is put to the government concerned, and the government concerned answers."
 POR_pressionar_o_subordinado: "Apply Pressure"
 POR_pressionar_o_subordinado_desc: "We remind a reluctant government of what it owes, who pays its army, and how recently it did not exist. It will be asked again, and it will resent us for it."
 portugal.60.t: "The Question of Federation"
 portugal.60.d: "Lisbon proposes that the arrangement under which we live be made permanent and given a name. We would send members to a federal parliament, our army would become a component of a federal army, and our foreign policy would be made in a city we do not live in.\n\n\n\nWhat is being offered is a share in something larger. What is being asked is the last thing we have that is entirely ours."
 portugal.60.a: "Accede to the federation"
 portugal.60.b: "We will remain sovereign"
 portugal.61.t: "They Have Agreed"
 portugal.61.d: "The delegation has accepted the terms. Their parliament will ratify, because their parliament is composed of people who understand what happened to the last government that did not."
 portugal.61.a: "Welcome them"
 portugal_news.5.t: "Portugal Summons an Imperial Conference"
 portugal_news.5.d: "Lisbon has invited the governments of several Lusophone states to a conference on what Portuguese officials are calling a community of destiny. Observers note that every government invited came to power with Portuguese assistance, and that none of them has declined to attend."
 portugal_news.5.a: "A community of destiny"
 portugal_news.6.t: "The Lusophone Federation Is Proclaimed"
 portugal_news.6.d: "Portugal and the states that accepted its terms have proclaimed a federal union, pooling their armies and foreign policy under a parliament sitting in Lisbon. States that declined remain formally sovereign.\n\n\n\nIt is the largest voluntary transfer of sovereignty since the European treaties, and almost nobody outside the federation believes the word voluntary."
 portugal_news.6.a: "Five centuries late"
