l_english:
 portugal_focus: "Portuguese Focus Tree"
 POR_atlantico_shortcut: "The Atlantic"

 ### POLITICS ###
 POR_a_terceira_republica: "The Third Republic"
 POR_a_terceira_republica_desc: "Twenty-six years of parliamentary government, four of them spent deciding whether we wanted it. The constitution has been revised five times and the state it describes is still the one the revolution built: large, slow, and answerable to everyone at once."
 POR_reforma_do_estado: "Reform of the State"
 POR_reforma_do_estado_desc: "Four ministries read a permit before anyone may pour concrete. We will not abolish any of them, because they cannot be abolished, but we can decide which one signs last."
 POR_combate_a_corrupcao: "Fighting Corruption"
 POR_combate_a_corrupcao_desc: "Nobody in Lisbon takes envelopes. They take seats on boards, consultancies for their brothers-in-law, and planning decisions in the district where they were born. It is not theft and it costs us more than theft would."
 POR_o_tribunal_de_contas: "The Court of Auditors"
 POR_o_tribunal_de_contas_desc: "A court that can stop a contract before the money moves rather than write a report about it afterwards. Every government since the revolution has promised this and every one of them discovered a reason to wait."
 POR_educacao_para_todos: "Education for All"
 POR_educacao_para_todos_desc: "A fifth of the country cannot read a contract it is asked to sign. That is the real ceiling on what our economy can make, and it will take a generation to lift."
 POR_o_recenseamento_da_diaspora: "The Diaspora Census"
 POR_o_recenseamento_da_diaspora_desc: "There are more Portuguese outside Portugal than in half our districts. Until now nobody in Lisbon could say how many, where, or what they were worth to us. A consulate that knows its community is an instrument."

 POR_road_ps_tt: "The £POR_western_social_democrat PS is in government"
 POR_road_psd_tt: "The £POR_western_conservative PSD is in government"
 POR_road_left_tt: "The £POR_anarchist_communism CDU or £POR_non_aligned_socialist_democrat Bloco de Esquerda is in government"
 POR_road_national_tt: "The £POR_Nat_Populism PNR or £POR_nationalist_monarchist Braganca is in government"
 POR_a_causa_real_tt: "The £POR_nationalist_monarchist Braganca polls above §Y15%%§!"

 ### POLITICS OF THE PUBLIC ARGUMENT ###
 POR_ideologia_modifier: "Ideological Development"
 POR_ideologia_modifier_desc: "How far the argument has travelled. A proposal that was unthinkable becomes arguable, then ordinary, and the country that has had the argument cannot un-have it. Every change of government widens it further, because each side teaches the public that the other side's settlement was never permanent."
 POR_bloc_left_majority_tt: "The £POR_western_social_democrat PS, £POR_anarchist_communism CDU, £POR_non_aligned_socialist_democrat Bloco de Esquerda, £POR_non_aligned_communism PCTP and £POR_emerging_communism POUS together won a §Ymajority§! at the last election"
 POR_bloc_right_majority_tt: "The £POR_western_conservative PSD, £POR_non_aligned_conservative CDS-PP, £POR_western_liberal Nos Cidadaos, £POR_Nat_Populism PNR and £POR_nationalist_monarchist Braganca together won a §Ymajority§! at the last election"
 POR_bloc_centre_majority_tt: "The £POR_western_social_democrat PS and £POR_western_conservative PSD together won a §Ymajority§! at the last election"
 POR_ideology_tier_1_tt: "§YIdeological Development§! is above §Y20§!"
 POR_ideology_tier_2_tt: "§YIdeological Development§! is above §Y40§!"
 POR_ideology_tier_3_tt: "§YIdeological Development§! is above §Y60§!"
 POR_ideology_tier_4_tt: "§YIdeological Development§! is above §Y80§!"
 portugal_news.7.t: "A Change of Government in Lisbon"
 portugal_news.7.d: "Power has changed hands in Lisbon. Whatever else it settles, it settles that the last government's arrangements were arrangements rather than facts, and everything they decided is now something that can be decided differently."
 portugal_news.7.a: "Nothing is permanent"

 ### CHARACTERS ###
 POR_jorge_silva_carvalho: "Jorge Silva Carvalho"
 POR_carlos_alberto_lopes: "Carlos Alberto Lopes"

 ### THE PARTY ROADS ###
 POR_o_ciclo_politico: "The Political Cycle"
 POR_o_ciclo_politico_desc: "Two parties have alternated in government since the revolution, and the country has learned to read an election as a change of personnel rather than of direction. Whoever holds the Assembly now can do rather more than that."
 POR_o_bloco_central: "The Central Bloc"
 POR_o_bloco_central_desc: "Socialists and social democrats governing together, which is either a national emergency measure or an admission that the two of them were never very far apart."
 POR_o_estado_social: "The Social State"
 POR_o_estado_social_desc: "The health service and the pension system were the revolution's real achievement and are the most expensive thing the state does. Defending them is what the party is for."
 POR_a_geringonca: "The Contraption"
 POR_a_geringonca_desc: "A minority government supported from outside by the communists and the left bloc, an arrangement its opponents named after a rickety machine and its authors were happy to keep the name for.\n\nIt should not work. It does."
 POR_a_alternancia: "Alternation"
 POR_a_alternancia_desc: "The social democrats return, as they always do, on the argument that the other lot cannot count. What they do with the office is the only question that matters."
 POR_o_choque_fiscal: "The Fiscal Shock"
 POR_o_choque_fiscal_desc: "Corporate tax comes down and the state stops pretending it can pick winners. Firms that were waiting for a reason to invest are given one."
 POR_a_coligacao_democratica: "The Democratic Coalition"
 POR_a_coligacao_democratica_desc: "The social democrats and the Christian democrats govern together, which gives the government a majority and the junior partner a permanent grievance."
 POR_a_frente_de_esquerda: "The Left Front"
 POR_a_frente_de_esquerda_desc: "The communists never went away and the left bloc has spent a decade assembling everyone who found the party too old and the socialists too comfortable. Together they are a government."
 POR_auditoria_a_divida: "Audit the Debt"
 POR_auditoria_a_divida_desc: "A public commission to establish which of our obligations were incurred legitimately and which were not. The answer is largely known in advance; the point is to have it said out loud before we act on it."
 POR_nacionalizacoes_estrategicas: "Strategic Nationalizations"
 POR_nacionalizacoes_estrategicas_desc: "Energy, water and the banks return to public hands. Whatever it does to the country's reputation among investors, it settles the question of who the utilities answer to."
 POR_a_reaccao_nacional: "The National Reaction"
 POR_a_reaccao_nacional_desc: "A politics that was unsayable for a generation is being said again, in public, by people with seats. The question is whether the parties of government intend to compete for those voters or to govern without them."
 POR_a_lei_da_ordem: "Law and Order"
 POR_a_lei_da_ordem_desc: "More police, faster courts and an interior ministry that answers questions from nobody. It is popular, it works, and it is very difficult to give back."
 POR_a_causa_real: "The Royal Cause"
 POR_a_causa_real_desc: "The House of Braganza never abdicated and never stopped being asked to. Duarte Pio has spent his life at the edge of national life, saying nothing that could be held against him, which in a republic this tired is a qualification.\n\nA crown would settle the question of who the state belongs to, and it would settle it against the Assembly."

 ### POLICY ###
 POR_o_programa_de_governo: "The Programme of Government"
 POR_o_programa_de_governo_desc: "A government is a list of things it intends to do and a majority willing to vote for them. We have the second. The first is what this is."
 POR_a_politica_economica: "Economic Policy"
 POR_a_politica_economica_desc: "Everything the state does to the economy is done through two instruments: what it takes and what it builds. Decide which one this government is for."
 POR_a_politica_financeira: "Financial Policy"
 POR_a_politica_financeira_desc: "The revenue has to come from somewhere, and where it comes from is the oldest argument in politics. There is no neutral tax."
 POR_o_imi_progressivo: "Progressive Property Tax"
 POR_o_imi_progressivo_desc: "The old municipal contribution is replaced by a rate assessed on what a property is actually worth. Nobody's income changes; a great many people's bills do, and the ones whose bills rise have been paying almost nothing for thirty years."
 POR_o_cadastro_predial: "The Land Register"
 POR_o_cadastro_predial_desc: "Half the country has never been surveyed, and the half that has was surveyed by people with an interest in the result. A register nobody can argue with is worth more than any rate we could set."
 POR_o_imposto_sobre_a_fortuna: "The Wealth Tax"
 POR_o_imposto_sobre_a_fortuna_desc: "Not on what is earned, and not on what is spent, but on what is held. Every argument against it has been made for two hundred years and the country has finally had the argument out loud."
 POR_o_irs_alargado: "Broadening the Income Tax"
 POR_o_irs_alargado_desc: "The base is narrow and the rates are high, which is the worst of both. More people pay, each of them pays less, and the revenue goes up regardless."
 POR_o_iva_geral: "The General VAT"
 POR_o_iva_geral_desc: "Consumption is the one thing that cannot leave the country. It is also the tax that falls hardest on people with nothing left over at the end of the month, and everybody in the Assembly knows it."
 POR_a_taxa_unica: "The Flat Tax"
 POR_a_taxa_unica_desc: "One rate, no brackets, no exemptions, and an accountancy profession with rather less to do. Capital arrives, revenue falls, and the argument about who carries the state gets a great deal louder."
 POR_a_autoridade_tributaria: "The Tax Authority"
 POR_a_autoridade_tributaria_desc: "Whoever wrote the code, somebody has to collect it. Merging the revenue services into one body with one database is the least ideological thing in this branch and probably the most effective."
 POR_fiscal_path_1_open_tt: "We are not committed to §Yincome and consumption taxation§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to repeal it"
 POR_fiscal_path_2_open_tt: "We are not committed to §Yasset taxation§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to repeal it"
 POR_fiscal_path_1_held_tt: "Portugal taxes §Yassets§!"
 POR_fiscal_path_2_held_tt: "Portugal taxes §Yincome and consumption§!"
 POR_abandon_fiscal_path_1_tt: "§RRepeals§! our asset taxes: the property tax, the land register and the wealth tax are §Rundone§! and their focuses may be taken again"
 POR_abandon_fiscal_path_2_tt: "§RRepeals§! our income and consumption taxes: the broadened income tax, the general VAT and the flat tax are §Rundone§! and their focuses may be taken again"

 ### THE DEFICIT ###
 POR_a_questao_do_deficit: "The Deficit Question"
 POR_a_questao_do_deficit_desc: "Three per cent is a number in a treaty and our number is not three per cent. In November 2002 Portugal became the first country ever placed in the excessive deficit procedure, which is a distinction of a kind."
 POR_a_comissao_constancio: "The Constancio Commission"
 POR_a_comissao_constancio_desc: "An independent committee is asked what the deficit actually was. The answer comes back at four point one per cent against the two point two we reported, and the government that commissioned it has to govern on that number."
 POR_o_orcamento_rectificativo: "The Rectifying Budget"
 POR_o_orcamento_rectificativo_desc: "A hiring freeze across the whole public administration and value added tax up two points in the middle of a fiscal year. Nobody has ever won an election on a rectifying budget."
 POR_a_saida_limpa: "The Clean Exit"
 POR_a_saida_limpa_desc: "We leave the programme with no precautionary credit line behind us, which is either confidence or bravado depending on who is asked. The markets decide which, and they decide quickly."
 POR_as_medidas_extraordinarias: "Extraordinary Measures"
 POR_as_medidas_extraordinarias_desc: "A tax amnesty, a securitisation of arrears, and two corporate pension funds moved onto the state's books in exchange for the liabilities. Every one of them is legal, every one of them counts, and every one of them has to be done again next year."
 POR_o_pacto_estupido: "The Stupid Pact"
 POR_o_pacto_estupido_desc: "The President of the Commission calls the Stability Pact stupid in a newspaper interview, and half of Europe privately agrees with him. If the rule cannot survive being applied to France and Germany, it is not a rule."
 POR_a_reversao_do_empobrecimento: "The Reversal of Impoverishment"
 POR_a_reversao_do_empobrecimento_desc: "Wages, pensions and the thirty-five hour week come back, the surcharge goes, and the minimum wage starts climbing again. The deficit falls anyway, which was supposed to be impossible."
 POR_o_conselho_das_financas_publicas: "The Public Finance Council"
 POR_o_conselho_das_financas_publicas_desc: "An independent body whose only job is to say in public whether the government's numbers add up. Every government that has one complains about it and none of them has abolished it."
 POR_deficit_path_1_open_tt: "We are not committed to §Yextraordinary measures§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to abandon them"
 POR_deficit_path_2_open_tt: "We are not committed to §Yconsolidation§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to abandon it"
 POR_deficit_path_1_held_tt: "Portugal is consolidating its §Ypublic accounts§!"
 POR_deficit_path_2_held_tt: "Portugal is meeting the deficit by §Yextraordinary measures§!"
 POR_abandon_deficit_path_1_tt: "§RAbandons§! consolidation: the audit, the rectifying budget and the clean exit are §Rundone§! and may be taken again"
 POR_abandon_deficit_path_2_tt: "§RAbandons§! the extraordinary measures: they and the confrontation with Brussels are §Rundone§! and may be taken again"

 ### THE BANKS ###
 POR_o_sistema_financeiro: "The Financial System"
 POR_o_sistema_financeiro_desc: "Five banks hold most of the country's deposits and two of them are about to become the state's problem. What we decide now is whether that is a sentence or a choice."
 POR_a_nacionalizacao_do_bpn: "The Nationalisation of the BPN"
 POR_a_nacionalizacao_do_bpn_desc: "A bank whose accounts turn out to have been fiction for a decade is taken into public ownership overnight to stop the queue forming at the door. The cost arrives in instalments for the next ten years."
 POR_a_recapitalizacao_da_caixa: "Recapitalising the Caixa"
 POR_a_recapitalizacao_da_caixa_desc: "The state bank needs capital and the state is its only shareholder. Brussels will allow it if we can show a private investor would have done the same, which requires a plan nobody quite believes."
 POR_o_banco_publico_de_fomento: "The Public Development Bank"
 POR_o_banco_publico_de_fomento_desc: "A state bank that lends to firms too small for the market and too productive to lose. Everyone agrees it is needed and nobody agrees who should run it."
 POR_a_liquidacao_do_bpp: "The Liquidation of the BPP"
 POR_a_liquidacao_do_bpp_desc: "A private bank is allowed to fail. The deposit guarantee covers the retail savers, the bondholders lose everything, and the lesson is delivered in public."
 POR_a_resolucao_do_bes: "The Resolution of the BES"
 POR_a_resolucao_do_bes_desc: "The bank is split in a weekend: the good half becomes a new institution and the shareholders and subordinated creditors are wiped out. The resolution fund borrows the money from the state, which is not the same as the state paying, except that it is."
 POR_a_venda_do_novo_banco: "The Sale of the Novo Banco"
 POR_a_venda_do_novo_banco_desc: "Three quarters of the bank goes to an American fund for an injection of capital rather than a price, and the state underwrites the losses on the old book. The resolution fund receives nothing."
 POR_a_supervisao_bancaria: "Banking Supervision"
 POR_a_supervisao_bancaria_desc: "The largest Portuguese banks pass under direct European supervision. Whatever else that does, it means the next crisis will be diagnosed by somebody who does not have lunch with the board."
 POR_banking_path_1_open_tt: "We are not committed to §Yletting banks fail§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to change course"
 POR_banking_path_2_open_tt: "We are not committed to §Ypublic bank rescues§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to change course"
 POR_banking_path_1_held_tt: "Portugal rescues its banks with §Ypublic money§!"
 POR_banking_path_2_held_tt: "Portugal resolves failed banks at the §Ycreditors' expense§!"
 POR_abandon_banking_path_1_tt: "§RAbandons§! the public rescue: the nationalisation, the recapitalisation and the development bank are §Rundone§! and may be taken again"
 POR_abandon_banking_path_2_tt: "§RAbandons§! resolution: the liquidation, the bank resolution and the sale are §Rundone§! and may be taken again"

 ### INDUSTRIAL POLICY ###
 POR_a_politica_industrial: "Industrial Policy"
 POR_a_politica_industrial_desc: "The state owns shares in the electricity company, the telephone company, the oil company, the airline and the post office. Whether that is an instrument or an embarrassment is the whole argument."
 POR_a_parpublica: "Parpublica"
 POR_a_parpublica_desc: "One holding company for everything the state owns, so that somebody in Lisbon can finally answer the question of what the state owns. It is also, and not incidentally, an instrument."
 POR_a_efacec: "Efacec"
 POR_a_efacec_desc: "A transformer manufacturer with an Angolan shareholder whose assets have been frozen by a court, and four thousand jobs that do not care whose name is on the shares. The state takes the stake because nobody else will."
 POR_a_tap_nacional: "The National Airline"
 POR_a_tap_nacional_desc: "An airline that loses money in every year it is not being sold, and that is the only operator flying to half the places our emigrants live. The case for keeping it has never been financial."
 POR_o_programa_de_privatizacoes: "The Privatisation Programme"
 POR_o_programa_de_privatizacoes_desc: "The electricity company and the grid operator go to Chinese and Omani state firms, which is either the market working or a state selling to other states depending on how the sentence is finished."
 POR_os_ctt_e_a_ana: "The Post Office and the Airports"
 POR_os_ctt_e_a_ana_desc: "The postal service is floated and the airport operator goes on a fifty-year concession to a French group. Both were profitable, which is what made them saleable."
 POR_o_fim_da_parpublica: "Winding Up the Portfolio"
 POR_o_fim_da_parpublica_desc: "The residual holdings go and the holding company that held them goes with it. Whatever the state wants to do to the economy after this, it will have to do with law rather than with shares."
 POR_a_concorrencia: "The Competition Authority"
 POR_a_concorrencia_desc: "A regulator with the power to fine the banks and the supermarkets, and the nerve to do it. Whoever owns the firms, somebody has to stop them agreeing with each other."
 POR_industrial_path_1_open_tt: "We are not committed to §Yselling the state's holdings§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to reverse it"
 POR_industrial_path_2_open_tt: "We are not committed to §Ystate shareholding§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to reverse it"
 POR_industrial_path_1_held_tt: "Portugal holds its industry through the §Ystate§!"
 POR_industrial_path_2_held_tt: "Portugal has sold its §Yindustrial holdings§!"
 POR_abandon_industrial_path_1_tt: "§RAbandons§! state shareholding: the holding company, Efacec and the airline are §Rundone§! and may be taken again"
 POR_abandon_industrial_path_2_tt: "§RReverses§! the privatisations: the sale proceeds and foreign stakes are §Rgiven back§! with the assets, and the focuses may be taken again"

 ### ENERGY ###
 POR_a_aposta_eolica: "The Wind Gamble"
 POR_a_aposta_eolica_desc: "A single tender for twelve hundred megawatts on a guaranteed tariff. It is an enormous bet on a technology that does not yet work at this scale, and within fifteen years it will be a fifth of our electricity."
 POR_o_fim_do_carvao: "The End of Coal"
 POR_o_fim_do_carvao_desc: "Sines closes nine years ahead of schedule and Pego follows it within the year. Portugal becomes the fourth country in Europe to burn no coal at all, which nobody would have predicted from here."
 POR_o_hidrogenio_de_sines: "The Hydrogen of Sines"
 POR_o_hidrogenio_de_sines_desc: "The refinery town becomes an electrolysis town, on the argument that the cheapest renewable electricity in Europe should be exported as something other than electricity."
 POR_o_ciclo_combinado: "Combined Cycle"
 POR_o_ciclo_combinado_desc: "Gas turbines that can be turned up when the wind drops, and a terminal at Sines to land the fuel. The renewable case depends on somebody building these and then not using them."
 POR_a_barragem_do_alqueva: "The Alqueva Dam"
 POR_a_barragem_do_alqueva_desc: "The largest artificial lake in western Europe, a village moved stone by stone to higher ground, and irrigation for a hundred and twenty thousand hectares of a province that had none."
 POR_a_central_nuclear: "The Nuclear Station"
 POR_a_central_nuclear_desc: "The argument Portugal has refused to have since the site at Ferrel was abandoned to protest. The Spanish plant across the border has been running the whole time, and we buy its output."
 POR_a_erse: "The Energy Regulator"
 POR_a_erse_desc: "Somebody has to decide what the tariff is, and to say out loud which of the guaranteed payments to generators were excessive. It makes no friends in either direction."
 POR_energy_path_1_open_tt: "We are not committed to §Ydispatchable generation§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to change course"
 POR_energy_path_2_open_tt: "We are not committed to §Yrenewables§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to change course"
 POR_energy_path_1_held_tt: "Portugal is building §Yrenewable§! generation"
 POR_energy_path_2_held_tt: "Portugal is building §Ydispatchable§! generation"
 POR_abandon_energy_path_1_tt: "§RAbandons§! the renewable programme. What is already built stays built, but the environmental settlement is §Rundone§! and the focuses may be taken again"
 POR_abandon_energy_path_2_tt: "§RAbandons§! dispatchable generation. What is already built stays built, but the nuclear settlement is §Rundone§! and the focuses may be taken again"

 ### PUBLIC WORKS ###
 POR_a_alta_velocidade: "High Speed Rail"
 POR_a_alta_velocidade_desc: "Lisbon to Madrid in under three hours, on a line that has been drawn and redrawn for twenty years. The contract is signed before anyone establishes where the money is coming from."
 POR_o_novo_aeroporto: "The New Airport"
 POR_o_novo_aeroporto_desc: "Five sites, four governments, three decades and one commission of inquiry. The argument about where to put Lisbon's second airport has outlasted most of the people who started it."
 POR_a_renegociacao_das_ppp: "Renegotiating the Partnerships"
 POR_a_renegociacao_das_ppp_desc: "The motorway concessions were written so that the state carried the traffic risk and the concessionaire carried none. Reopening them saves real money and teaches the next set of lawyers nothing."
 POR_o_cancelamento_do_tgv: "Cancelling the High Speed Line"
 POR_o_cancelamento_do_tgv_desc: "The line and the third crossing of the Tagus are cancelled outright in a single afternoon. The compensation is cheaper than the construction, which is the whole argument."
 POR_o_porto_de_sines: "The Port of Sines"
 POR_o_porto_de_sines_desc: "The deepest water on the Atlantic coast of Europe, a container terminal that keeps outgrowing itself, and a freight corridor to the Spanish border. Whatever else we build, the ships still have to arrive somewhere."
 POR_obras_path_1_open_tt: "We are not committed to §Ycancelling the public works§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to revive them"
 POR_obras_path_2_open_tt: "We are not committed to §Ythe great public works§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to cancel them"
 POR_obras_path_1_held_tt: "Portugal is building its §Ygreat public works§!"
 POR_obras_path_2_held_tt: "Portugal has §Ycancelled§! the great public works"
 POR_abandon_obras_path_1_tt: "§RAbandons§! the public works programme. What is built stays built, and the focuses may be taken again"
 POR_abandon_obras_path_2_tt: "§RReverses§! the cancellations: the money saved is §Rgiven back§! and the focuses may be taken again"

 ### LABOUR ###
 POR_o_codigo_do_trabalho_de_2009: "The Labour Code of 2009"
 POR_o_codigo_do_trabalho_de_2009_desc: "Flexibility in exchange for security, negotiated with one union confederation and fought by the other. The hours bank arrives, and so does the argument about who chooses when the hours are worked."
 POR_o_salario_minimo: "The Minimum Wage"
 POR_o_salario_minimo_desc: "Frozen for four years, then raised every January for a decade. Every raise was going to destroy employment and none of them did, which has not settled the argument."
 POR_o_codigo_do_trabalho_de_2003: "The Labour Code of 2003"
 POR_o_codigo_do_trabalho_de_2003_desc: "The first consolidation of Portuguese labour law since before the revolution, carried against a general strike. What it consolidates is mostly the employer's side."
 POR_a_lei_23_2012: "Law 23 of 2012"
 POR_a_lei_23_2012_desc: "Overtime halved, severance cut by more than half, four public holidays abolished and collective dismissal made easier. Collective bargaining coverage falls from nearly two million workers to a third of a million inside two years."
 POR_a_concertacao_social: "Social Concertation"
 POR_a_concertacao_social_desc: "Government, employers and unions in one room signing a medium-term agreement. It works whenever both sides have already lost an argument in public and need somewhere to put the result."
 POR_labour_path_1_open_tt: "We are not committed to §Ylabour flexibility§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to reverse it"
 POR_labour_path_2_open_tt: "We are not committed to §Ylabour protection§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to reverse it"
 POR_labour_path_1_held_tt: "Portugal protects §Ythe contract§!"
 POR_labour_path_2_held_tt: "Portugal has made the labour market §Yflexible§!"
 POR_abandon_labour_path_1_tt: "§RRepeals§! the protective labour code and the minimum wage settlement, which are §Rundone§! and may be taken again"
 POR_abandon_labour_path_2_tt: "§RRepeals§! the flexible labour code: the regulation ladder is §Rwound back§! and the focuses may be taken again"

 ### SOCIAL POLICY ###
 POR_a_politica_social: "Social Policy"
 POR_a_politica_social_desc: "Portugal spends nineteen per cent of its output on social protection against a European average near twenty-six. Every argument in this branch is about that gap and who should close it."
 POR_o_pacto_de_cooperacao: "The Pact of Cooperation"
 POR_o_pacto_de_cooperacao_desc: "Most Portuguese social care is delivered by charities, mutualities and the Misericordias rather than by the state, under a framework the state signs and funds. It is cheaper than the alternative and nobody is quite willing to say so out loud."
 POR_o_sistema_de_saude: "The Health System"
 POR_o_sistema_de_saude_desc: "A national health service built after the revolution, free at the point of use, and a parallel scheme for civil servants that most of the political class belongs to. Family health units are the reform everybody agrees on."
 POR_a_lei_de_bases_da_saude: "The Basic Health Law"
 POR_a_lei_de_bases_da_saude_desc: "The 1990 settlement is repealed and hospital management can no longer be put out to concession. It passes on amendments from the parties to the government's left, which is the whole story of the arrangement."
 POR_o_fim_das_parcerias: "The End of the Partnerships"
 POR_o_fim_das_parcerias_desc: "Braga, Vila Franca, Loures and Cascais come back into public management as their thirty-year contracts expire. Each one costs more to run the day after than the day before, and each one is kept."
 POR_a_lei_de_bases_de_2002: "The Basic Law of 2002"
 POR_a_lei_de_bases_de_2002_desc: "Thirty-four hospitals become public companies in a single December, and the legal base for private hospital management is written. The service stays free; who runs it stops being settled."
 POR_as_parcerias_publico_privadas: "The Hospital Partnerships"
 POR_as_parcerias_publico_privadas_desc: "Four new hospitals built and run on thirty-year contracts by private consortia. They are measurably efficient and there is no mechanism to find out what happens at the end."
 POR_health_path_1_open_tt: "We are not committed to §Ycontracted healthcare§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to reverse it"
 POR_health_path_2_open_tt: "We are not committed to §Ya wholly public service§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to reverse it"
 POR_health_path_1_held_tt: "Portugal runs a §Ywholly public§! health service"
 POR_health_path_2_held_tt: "Portugal §Ycontracts§! for health care"
 POR_abandon_health_path_1_tt: "§RRepeals§! the public health settlement, which is §Rundone§! and may be taken again"
 POR_abandon_health_path_2_tt: "§RRepeals§! the hospital partnerships, which are §Rundone§! and may be taken again"

 ### EDUCATION ###
 POR_o_sistema_educativo: "The Education System"
 POR_o_sistema_educativo_desc: "The first international assessment put Portuguese fifteen-year-olds near the bottom of the developed world. Within fifteen years they are at the average, which is the largest improvement anybody recorded."
 POR_a_escolaridade_obrigatoria: "Compulsory Schooling to Eighteen"
 POR_a_escolaridade_obrigatoria_desc: "Twelve years of schooling for everyone, and a programme that certifies the skills of a million adults who left at fourth grade. It is the single largest thing any government here does to the ceiling on the economy."
 POR_o_plano_tecnologico_da_educacao: "The Technological Plan for Education"
 POR_o_plano_tecnologico_da_educacao_desc: "Broadband and a board in every classroom, and half a million laptops built in Matosinhos and sold to schoolchildren for five euros. Whatever it did for learning, it built a computer industry from nothing."
 POR_os_contratos_de_associacao: "The Association Contracts"
 POR_os_contratos_de_associacao_desc: "The state pays private schools to teach where it has no school of its own. Where it does have one, paying twice is harder to defend, and that is exactly where the argument sits."
 POR_o_rigor_curricular: "Curricular Rigour"
 POR_o_rigor_curricular_desc: "National exams return at the fourth and sixth grades, the curriculum is written down as targets, and schools are merged into larger groupings. The results improve and the profession never forgives it."
 POR_education_path_1_open_tt: "We are not committed to §Ystate-funded private schooling§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to reverse it"
 POR_education_path_2_open_tt: "We are not committed to §Ycomprehensive schooling§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to reverse it"
 POR_education_path_1_held_tt: "Portugal funds §Yone school for everyone§!"
 POR_education_path_2_held_tt: "Portugal funds §Ythe pupil, not the school§!"
 POR_abandon_education_path_1_tt: "§RRepeals§! the comprehensive settlement, which is §Rundone§! and may be taken again"
 POR_abandon_education_path_2_tt: "§RRepeals§! the association contracts and the curricular reform, which are §Rundone§! and may be taken again"

 ### HOUSING ###
 POR_a_questao_da_habitacao: "The Housing Question"
 POR_a_questao_da_habitacao_desc: "Seven hundred thousand empty dwellings, a third of the rents in central Lisbon still frozen at nineteen-eighties levels, and the smallest public housing stock in western Europe. All three at once."
 POR_a_lei_de_bases_da_habitacao: "The Basic Housing Law"
 POR_a_lei_de_bases_da_habitacao_desc: "Portugal's first basic law on housing puts the right to a dwelling into ordinary law rather than leaving it in the constitution where nobody can use it."
 POR_o_arrendamento_forcado: "Compulsory Letting"
 POR_o_arrendamento_forcado_desc: "A municipality may take a dwelling that has stood empty for two years and let it. It is vetoed, overridden, and repealed within two years, and for those two years it is the most argued-about paragraph in the country."
 POR_o_novo_regime_do_arrendamento: "The New Urban Lease Regime"
 POR_o_novo_regime_do_arrendamento_desc: "The frozen rents end after a five-year transition and eviction becomes an administrative procedure. It unlocks the centre of every Portuguese city, and it empties a good deal of it first."
 POR_o_alojamento_local: "Short-Let Accommodation"
 POR_o_alojamento_local_desc: "A register, a licence and a hundred thousand apartments. The centres of Lisbon and Porto are rebuilt in a decade by people who do not live in them."
 POR_housing_path_1_open_tt: "We are not committed to §Ythe housing market§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to intervene in it"
 POR_housing_path_2_open_tt: "We are not committed to §Ytenant protection§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to reverse it"
 POR_housing_path_1_held_tt: "Portugal treats housing as a §Yright§!"
 POR_housing_path_2_held_tt: "Portugal treats housing as a §Ymarket§!"
 POR_abandon_housing_path_1_tt: "§RRepeals§! the housing settlement, which is §Rundone§! and may be taken again"
 POR_abandon_housing_path_2_tt: "§RRepeals§! the lease liberalisation, which is §Rundone§! and may be taken again"

 ### SOCIAL SECURITY ###
 POR_a_seguranca_social: "Social Security"
 POR_a_seguranca_social_desc: "A pay-as-you-go system promising today's contributors a pension paid by people not yet born, and an index invented so that every benefit stops rising with the minimum wage."
 POR_o_rendimento_social_de_insercao: "The Social Insertion Income"
 POR_o_rendimento_social_de_insercao_desc: "A minimum income with a contract attached, cut in every crisis and restored after every one. It is the cheapest thing the state does and the most argued about per escudo spent."
 POR_o_fim_do_factor_de_sustentabilidade: "Abolishing the Sustainability Factor"
 POR_o_fim_do_factor_de_sustentabilidade_desc: "The coefficient that quietly cuts every new pension by the rise in life expectancy since 2006 is repealed. It had reached fifteen per cent, and almost nobody retiring knew it existed."
 POR_o_factor_de_sustentabilidade: "The Sustainability Factor"
 POR_o_factor_de_sustentabilidade_desc: "Pensions are tied to life expectancy, the whole career replaces the best ten years, and the reference index stops being the minimum wage. It is arithmetic, and arithmetic is not popular."
 POR_a_condicao_de_recursos: "The Resources Test"
 POR_a_condicao_de_recursos_desc: "One uniform means test across every benefit, counting the whole household and its savings. Tens of thousands of families leave the rolls in the first year, which is either the point or the cost."
 POR_social_path_1_open_tt: "We are not committed to §Ypension retrenchment§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to reverse it"
 POR_social_path_2_open_tt: "We are not committed to §Ythe pay-as-you-go promise§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to reverse it"
 POR_social_path_1_held_tt: "Portugal keeps the §Ypay-as-you-go promise§!"
 POR_social_path_2_held_tt: "Portugal has tied pensions to §Ywhat can be paid§!"
 POR_abandon_social_path_1_tt: "§RRepeals§! the welfare settlement, which is §Rundone§! and may be taken again"
 POR_abandon_social_path_2_tt: "§RRepeals§! the pension retrenchment, which is §Rundone§! and may be taken again"

 ### THE CONSCIENCE VOTES ###
 POR_as_questoes_de_costumes: "Questions of Conscience"
 POR_as_questoes_de_costumes_desc: "The votes where the parties release their members and the country finds out what it actually thinks. Between them they decided more about how Portugal lives than any budget did."
 POR_o_referendo_de_2007: "The Referendum of 2007"
 POR_o_referendo_de_2007_desc: "Fifty-nine per cent vote yes on a turnout too low to bind anybody. Parliament legislates anyway, which is either respecting the majority who voted or ignoring the majority who did not."
 POR_o_casamento_igualitario: "Marriage Equality"
 POR_o_casamento_igualitario_desc: "Civil marriage is opened without adoption, and adoption follows six years later over a presidential veto. Each step is smaller than its opponents feared and larger than its authors admitted."
 POR_a_concordata_de_2004: "The Concordat of 2004"
 POR_a_concordata_de_2004_desc: "A new agreement with the Holy See replaces the one signed under the dictatorship. Religious education stays in state schools as a choice, and the Church keeps its standing in tax and property."
 POR_a_defesa_da_vida: "The Defence of Life"
 POR_a_defesa_da_vida_desc: "A moderating fee and compulsory prior counselling, carried in one parliament and repealed in the next. The argument does not end; it changes venue."
 POR_costumes_path_1_open_tt: "We are not committed to §Ythe conservative settlement§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to change it"
 POR_costumes_path_2_open_tt: "We are not committed to §Ythe liberal settlement§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to change it"
 POR_costumes_path_1_held_tt: "Portugal has legislated the §Yliberal§! settlement"
 POR_costumes_path_2_held_tt: "Portugal has legislated the §Yconservative§! settlement"
 POR_abandon_costumes_path_1_tt: "§RRepeals§! the liberal settlement on conscience questions, which is §Rundone§! and may be legislated again"
 POR_abandon_costumes_path_2_tt: "§RRepeals§! the conservative settlement on conscience questions, which is §Rundone§! and may be legislated again"
 POR_a_descriminalizacao: "Decriminalisation"
 POR_a_descriminalizacao_desc: "Possession stops being a crime and becomes a matter for a panel of a doctor, a lawyer and a social worker. The rest of the world spends twenty years deciding whether we were right, and drug deaths here fall by nine tenths."

 ### ECONOMY ###
 POR_o_programa_de_convergencia: "The Convergence Program"
 POR_o_programa_de_convergencia_desc: "Brussels sets the deficit target and we write the budget that meets it. Convergence is the polite word for spending the next decade catching up to countries that were never behind."
 POR_o_euro_e_a_divida: "The Euro and the Debt"
 POR_o_euro_e_a_divida_desc: "We borrowed at German rates against Portuguese growth, and the difference has been accumulating quietly since the day we joined. There is no devaluation available to us now. There is only the arithmetic."
 POR_a_reestruturacao_da_divida: "Debt Restructuring"
 POR_a_reestruturacao_da_divida_desc: "We go to our creditors, we open the books, and we pay for the privilege of being believed. It is expensive, it is humiliating, and it works."
 POR_a_alternativa_soberana: "The Sovereign Alternative"
 POR_a_alternativa_soberana_desc: "We stop servicing the debt on the schedule our creditors prefer and start servicing it on ours. The markets will have opinions about this, and we will pay for those opinions for years."
 POR_o_regresso_aos_mercados: "Return to the Markets"
 POR_o_regresso_aos_mercados_desc: "The first auction after a restructuring is the only one that matters. If it clears, the thing is over. If it does not, nothing else we have done counts for anything."
 POR_a_reindustrializacao: "Reindustrialization"
 POR_a_reindustrializacao_desc: "We cannot win on wages against countries with none, so we will stop trying. What we can sell is precision, moulds, components and the people who know how to make them."
 POR_a_web_summit: "The Web Summit"
 POR_a_web_summit_desc: "Seventy thousand people in Parque das Nacoes for a week, and a standing argument about whether it is worth what we pay for it. What it actually buys is the first generation in living memory with a reason to stay."
 POR_portugal_2030: "Portugal 2030"
 POR_portugal_2030_desc: "The last European framework we will spend as a net recipient. Whatever the country is going to be, it has to be built with this money, because there will not be another round of it."

 ### THE LUSOPHONE WORLD ###
 POR_a_comunidade_lusofona: "The Lusophone Community"
 POR_a_comunidade_lusofona_desc: "Eight countries, four continents, two hundred and fifty million speakers and no institution worth the name. Everyone involved agrees something should be built. Only we have a reason to build it."
 POR_o_instituto_camoes: "The Camoes Institute"
 POR_o_instituto_camoes_desc: "Language schools, teacher exchanges, a seat at every ministry of education from Praia to Dili. The cheapest instrument of foreign policy ever devised, and the only one nobody objects to."
 POR_a_realpolitik_lusofona: "Lusophone Realpolitik"
 POR_a_realpolitik_lusofona_desc: "The community of language is real and it is also a map of where we are already trusted. A government that is trusted in eight capitals can do things in those capitals that nobody else can.\n\nWe will stop pretending that is sentiment."
 POR_os_amigos_do_regime: "Friends of the Regime"
 POR_os_amigos_do_regime_desc: "A retainer for the minister's brother, a scholarship for the general's daughter, a directorship for the man who runs the port. None of it is illegal in any of the countries concerned, which is the point of doing it that way."
 POR_a_rede_de_oficiais: "The Officer Network"
 POR_a_rede_de_oficiais_desc: "Every officer corps in the Lusophone world was trained in a language we gave them, and a good number of them at our academies. Men who studied together stay in touch, and men who stay in touch can be reached."
 POR_a_via_discreta: "The Discreet Road"
 POR_a_via_discreta_desc: "Nothing is signed, nothing is announced and no Portuguese uniform is ever photographed. What we do will still be obvious to anyone who looks, and the whole art is in making sure nobody has to."
 POR_a_via_aberta: "The Open Road"
 POR_a_via_aberta_desc: "We stop apologising for having interests. A country that says plainly what it wants in Africa will be believed there, and will be resented everywhere else."
 POR_a_legiao_portuguesa: "The Portuguese Legion"
 POR_a_legiao_portuguesa_desc: "A standing pool of officers and volunteers held apart from the regular establishment. They are not an expeditionary force and must never be described as one; they are men available to go somewhere difficult at short notice."
 POR_o_pronunciamento: "The Pronunciamento"
 POR_o_pronunciamento_desc: "The Iberian tradition is not the coup but the pronouncement: officers who declare what the nation requires and wait to be agreed with. It has worked twice in our own history and we have taught it to every army that speaks our language."
 POR_a_escola_de_guerra_de_africa: "The African War School"
 POR_a_escola_de_guerra_de_africa_desc: "Thirteen years of colonial war taught this army things no other European army learned, and we spent twenty-five years forgetting them. The men who remember are still alive, and they can still teach."
 POR_a_projeccao_de_forcas: "Force Projection"
 POR_a_projeccao_de_forcas_desc: "Transport aircraft, a logistics chain that does not depend on the goodwill of a neighbouring government, and the legal authority to use both without a debate in the Assembly."
 POR_a_segunda_vaga: "The Second Wave"
 POR_a_segunda_vaga_desc: "One operation at a time is a policy. Two is an empire, and the difference is entirely in what our own services can carry without losing track of it."
 POR_estagio_needs_a_war_tt: "Portuguese forces are §Ydeployed overseas§!"
 POR_a_saida_atlantica_tt: "Our exposure is above §Y35§!"
 POR_o_imperio_informal_tt: "We have at least §Y1§! Lusophone client government"
 POR_a_segunda_vaga_tt: "We may sponsor §Y1§! additional operation at a time"
 POR_a_questao_europeia: "The European Question"
 POR_a_questao_europeia_desc: "Everything we do overseas is done by a member state of the European Union, and sooner or later somebody in Brussels will ask what exactly we are doing. We should decide now what we intend to say."
 POR_permanecer_na_europa: "Remain in Europe"
 POR_permanecer_na_europa_desc: "We stand the operations down, we let the files go cold, and we keep the seat, the fund transfers and the currency. What we have already built stays built; what we were going to build next does not."
 POR_permanecer_na_europa_tt: "We may no longer begin new §Roperations§!. Countries already ours §Gremain§! ours."
 POR_a_saida_atlantica: "The Atlantic Exit"
 POR_a_saida_atlantica_desc: "A country with an ocean, eight relationships nobody else has, and no further use for permission. We leave the alliance, we accept what that does to us in Europe, and we stop explaining ourselves."
 POR_o_imperio_informal: "The Informal Empire"
 POR_o_imperio_informal_desc: "No governors, no garrisons and no colonial budget. Governments that owe us their existence, sign what we put in front of them, and are answerable to their own electorates for everything that goes wrong.\n\nThe Estado Novo spent a generation of conscripts learning that the other way does not work."

 ### SHADOW OPERATIONS ###
 POR_shadow_ops_category: "Lusophone Operations"
 POR_escola_ultramar_category: "The Overseas War School"
 POR_cultivar_a_rede: "Cultivate the Network"
 POR_cultivar_a_rede_desc: "A retainer here, a scholarship there, a seat on a board for a minister's brother. None of it is illegal and all of it is remembered."
 POR_cultivar_a_rede_tt: "Costs §Y1.50§! billion"
 POR_armar_os_nossos: "Arm Our Friends"
 POR_armar_os_nossos_desc: "The crates leave Setubal marked as agricultural machinery and arrive as what they are. We send no Portuguese with them, which is the entire point."
 POR_armar_os_nossos_tt: "Costs §Y1.00§! billion"
 POR_comprar_os_generais: "Buy the Officer Corps"
 POR_comprar_os_generais_desc: "Colonels are cheaper than wars. The ones we pay decide whether a rebellion has an army behind it or only a grievance, and they are the hardest thing we do to keep quiet."
 POR_comprar_os_generais_tt: "Costs §Y2.00§! billion"
 POR_desactivar_o_dossie: "Burn the Dossier"
 POR_desactivar_o_dossie_desc: "Our people come home, the accounts close and the file goes into a stove in Belem. We lose the country and we buy back the quiet."
 POR_estagio_na_selva: "Jungle Tour"
 POR_estagio_na_selva_desc: "An officer attached to a war we are already standing in, where the fighting is in the bush and nothing arrives on time. He comes back changed, or he comes back having learned nothing."
 POR_estagio_na_floresta: "Bush War Tour"
 POR_estagio_na_floresta_desc: "The wars in Angola and Mozambique are fought in forest and scrub against an enemy who never forms a line. There is no way to teach that at Amadora."
 POR_estagio_tt: "Costs §Y1.50§! billion"

 POR_o_pronunciamento_local: "The Pronunciamento"
 POR_o_pronunciamento_local_desc: "The colonels we have been paying will move against their government. Everything we have built in that country is spent at once, and for forty-five days it is still possible for someone in the capital to notice."
 POR_o_pronunciamento_local_tt: "Costs §Y6.00§! billion"
 POR_pronunciamento_aborted_tt: "The rising did §Rnot§! take place. Events overtook it."

 ### THE TIMELINE ###
 portugal.6.t: "The Men from the Troika"
 portugal.6.d: "The rates we borrow at have passed the point where borrowing is possible, and three institutions have arrived in Lisbon with a programme already written. The money is real. So is the list of what we will do to get it: wages, pensions, the health service, the labour code, and a schedule of privatisations somebody else drew up.\n\nThe alternative is to find the money ourselves, from a market that has already decided what it thinks of us."
 portugal.6.a: "Sign the memorandum"
 portugal.6.b: "We will manage alone"
 portugal.11.t: "Timor Is Independent"
 portugal.11.d: "At midnight the flag went up in Dili and a country we governed for four hundred years, abandoned in 1975 and occupied for twenty-four, became independent. Portuguese is one of its two official languages, largely because the generation that fought the occupation chose it as the language the occupiers could not read.\n\nWe owe them something. What we do about it is a question of how we intend to be owed things by other people."
 portugal.11.a: "The obligation does not end with the flag"
 portugal.11.b: "They are a country now"
 portugal.13.t: "The Colonels in Sao Tome"
 portugal.13.d: "The army has taken the presidential palace while the president was abroad, and the officers holding it have issued the usual list of grievances about pay, corruption and the oil contracts. Nigeria is already offering to mediate.\n\nWe are the former metropole, we are owed a hearing, and nobody else in that palace speaks to Lisbon before they speak to anyone."
 portugal.13.a: "Mediate, and be seen to"
 portugal.13.b: "Deal with whoever holds the palace"

 ### EVENTS ###
 portugal.20.t: "Disquiet in the Officer Corps"
 portugal.20.d: "Something is moving in the garrisons. Officers who have never had money are spending it, the same three colonels are meeting at the same house, and the reports from the interior have stopped arriving. There is a Portuguese name attached to all of it, and no proof of anything.\n\nWe can break up the officer corps now and accept what that does to the army, or we can decide that a country cannot be governed on rumour."
 portugal.20.a: "Purge the officer corps"
 portugal.20.b: "We do not govern on rumour"
 portugal.31.t: "The Rising"
 portugal.31.d: "It began before dawn. The barracks declared first, the radio station an hour later, and by the time the ministries understood what was happening the colonels were reading a proclamation over the air.\n\nNo Portuguese soldier is within a thousand kilometres of it. Every rifle in the hands of the men reading that proclamation came out of a warehouse in Setubal, and every colonel holding the capital has been on a Portuguese retainer for years."
 portugal.31.a: "They are ours"
 portugal.32.t: "A Friendly Government"
 portugal.32.d: "The war is over and our people are in the ministries. What we have is not a colony and could not survive being called one: it is a government that owes us its existence, signs what we put in front of it, and will go on doing so exactly as long as that arrangement suits both of us.\n\nThe Estado Novo spent thirteen years and a generation of conscripts trying to hold this country. We have it back for the price of a few colonels."
 portugal.32.a: "The empire was always a commercial proposition"
 portugal.34.t: "Our People Are Dead"
 portugal.34.d: "The government we tried to unseat is still there, and it has spent the last week hanging the officers we paid. The survivors have named us, at length, in front of cameras.\n\nThere is no denying this one. The only question is how much of it reaches Brussels."
 portugal.34.a: "Burn the files"
 portugal_news.1.t: "Officers Declare Against Their Government"
 portugal_news.1.d: "Army officers have declared against their government, seizing the capital's radio station and several garrison towns overnight. The rebels have announced a provisional administration and appealed for international recognition.\n\nThe government has accused unnamed foreign interests of financing the rising."
 portugal_news.1.a: "Another African war"
 portugal_news.2.t: "The Rebels Take Power"
 portugal_news.2.d: "The civil war has ended with the rebel administration in control of the capital and the outgoing government in exile. The new government has moved quickly to normalise relations with Lisbon, where officials describe the outcome as a matter for that country's citizens alone."
 portugal_news.2.a: "A matter for them alone"

 ### DYNAMIC MODIFIERS ###
 POR_a_republica: "The Third Republic"
 POR_a_republica_desc: "What state reform, the anti-corruption drive and the party roads have done to how Portugal is governed."
 POR_convergencia: "The Convergence Programme"
 POR_convergencia_desc: "The euro, the debt and the reindustrialisation, as they stand after each decision taken about them."
 POR_exercito: "The Armed Forces"
 POR_exercito_desc: "Professionalisation, procurement and whichever doctrinal school the general staff settled on."
 POR_programa_de_governo: "The Programme of Government"
 POR_programa_de_governo_desc: "The standing authority a government gets from having published a programme and been held to it."
 POR_marinha: "The Portuguese Navy"
 POR_marinha_desc: "The running ledger of what the fleet can find, hide from and carry."
 POR_politica_financeira: "Financial Policy"
 POR_politica_financeira_desc: "Everything the tax code, the budget rule and the banking settlement currently do to the country. A government that repeals its predecessor's work takes its entry out of this list."
 POR_politica_industrial: "Industrial Policy"
 POR_politica_industrial_desc: "The state's holdings, the electricity mix, the public works and the labour code, as they stand after the last government that had the votes to change them."
 POR_politica_social: "Social Policy"
 POR_politica_social_desc: "Health, schooling, housing, pensions and the questions of conscience, as legislated. Repealing a settlement takes its entry out of this list and leaves the argument behind."
 POR_shadow_network: "The Lusophone Network"
 POR_shadow_network_desc: "Chambers of commerce, seminaries, staff colleges and the men who move between them. Nothing here appears in a treaty, and all of it shortens the distance between Lisbon and a decision taken overseas."
 POR_doutrina_ultramarina: "Overseas Doctrine"
 POR_doutrina_ultramarina_desc: "Officers who have fought in the bush teach the ones who have not. The doctrine only advances while the wars are running, and it fades once our people come home."
 POR_intervencao_ultramarina: "The Weight of Distance"
 POR_intervencao_ultramarina_desc: "Every drum of fuel and every crate of ammunition reaches the theatre by sea, six thousand kilometres from the nearest Portuguese depot, and a good part of what is landed is stolen, sold at the roadside or written off before it reaches anyone who intended to fire it. The heavier the force we send, the more of it evaporates on the way.\n§W--------------§!\nThis modifier will be §RRemoved§! when Portuguese volunteers are no longer deployed abroad."
 POR_eu_exposure_modifier: "Under Investigation"
 POR_eu_exposure_modifier_desc: "Brussels has noticed. What began as questions from the Commission about our overseas dealings becomes, at length, a question about our standing in the Union.\n§W--------------§!\nThis modifier will be §RRemoved§! if our exposure falls below §Y15§!."

 ### NATIONAL SPIRITS ###
 POR_a_divida_publica_1: "The Public Debt"
 POR_a_divida_publica_1_desc: "We joined the single currency on the strength of cheap credit, and we have spent a decade borrowing against a growth rate we never achieved. Every escudo of the old debt is now denominated in a currency we cannot devalue.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$POR_o_euro_e_a_divida$§! focus, and again with the §Y$POR_a_reestruturacao_da_divida$§! or §Y$POR_a_alternativa_soberana$§! focus. It will be §RRemoved§! if we complete the §Y$POR_o_regresso_aos_mercados$§! focus."
 POR_a_economia_de_baixo_valor_1: "An Economy of Low Value"
 POR_a_economia_de_baixo_valor_1_desc: "Textiles, footwear and assembly work built the republic we have, and none of it survives contact with cheaper labour elsewhere. Our firms compete on price because we have given them nothing else to compete on.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$POR_educacao_para_todos$§! focus, and again with the §Y$POR_a_reindustrializacao$§! focus. It will be §RRemoved§! if we complete the §Y$POR_portugal_2030$§! focus."
 POR_o_estado_pesado_1: "The Heavy State"
 POR_o_estado_pesado_1_desc: "Four ministries will read a permit before anyone may pour concrete, and each of them answers to a different party. The administration is not corrupt so much as it is slow, and slowness has a price that is paid in contracts awarded to whoever waited longest.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$POR_reforma_do_estado$§! focus, and again with the §Y$POR_combate_a_corrupcao$§! focus. It will be §RRemoved§! if we complete the §Y$POR_o_tribunal_de_contas$§! focus."
 POR_a_emigracao_1: "A Nation That Leaves"
 POR_a_emigracao_1_desc: "There are Portuguese communities in Paris, Toronto, Caracas and Johannesburg larger than most of our districts. They send money home and they do not come back, and the villages they left are older every year. What we lose in people we keep in reach.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete the §Y$POR_o_recenseamento_da_diaspora$§! focus. It will be §RRemoved§! if we complete the §Y$POR_a_web_summit$§! focus."
 POR_o_fim_do_imperio: "The End of Empire"
 POR_o_fim_do_imperio_desc: "For five hundred years this was a small country with a very long reach, and for twenty-six years it has been a small country. The language remains, the companies remain, the families remain. Only the authority is gone.\n§W--------------§!\nThis national spirit will be §RRemoved§! and replaced by the §YInformal Empire§! if we complete the §Y$POR_a_realpolitik_lusofona$§! focus."
 POR_o_imperio_informal_idea: "The Informal Empire"
 POR_o_imperio_informal_idea_desc: "We no longer govern anything overseas. We do not need to. A shared language, a shared church, a shared officer class and the banks that clear their trade will carry an instruction further than a governor ever did."
 POR_o_quinto_imperio_idea: "The Fifth Empire"
 POR_o_quinto_imperio_idea_desc: "Vieira promised a fifth empire after Assyria, Persia, Greece and Rome, and Pessoa promised it again in verse. Neither of them expected it to be assembled out of mining concessions, military missions and a currency board, but it is being assembled."

 ### THE PORTUGUESE LEGION ###
 POR_idea_legiao_portuguesa_1: "The Portuguese Legion"
 POR_idea_legiao_portuguesa_1_desc: "A standing pool of officers and volunteers, kept apart from the regular establishment and paid from a budget line nobody reads aloud. They train for somewhere hot, far away, and legally ambiguous."

 ### THE CLIENT LADDER ###
 POR_presenca_lusofona_1: "Portuguese Presence"
 POR_presenca_lusofona_1_desc: "Portuguese firms hold the shipping agency, the telephone concession and the cement works. Portuguese officers sit in on the planning. Nothing about this arrangement appears in a treaty, and everything about it appears in the trade figures."

 ### THE ARMED FORCES ###
 POR_as_forcas_armadas: "The Armed Forces"
 POR_as_forcas_armadas_desc: "Three services shaped by thirteen years of colonial war and twenty-five years of forgetting it. The equipment is old, the experience is real, and nobody in the general staff has planned for a European battlefield in their working life."
 POR_a_profissionalizacao: "The End of Conscription"
 POR_a_profissionalizacao_desc: "The last conscript class leaves and is not replaced. A volunteer army is smaller, better and considerably more willing to go somewhere far away without a national debate about it."
 POR_a_brigada_mecanizada: "The Mechanized Brigade"
 POR_a_brigada_mecanizada_desc: "Santa Margarida holds the only formation we have that could fight a conventional enemy, and it is equipped with vehicles older than the men driving them."
 POR_o_leopard_2a6: "The Leopard 2A6"
 POR_o_leopard_2a6_desc: "Thirty-seven tanks from Dutch surplus, which is both a serious capability and an admission about how we intend to acquire equipment from now on."
 POR_a_brigada_de_reaccao_rapida: "The Rapid Reaction Brigade"
 POR_a_brigada_de_reaccao_rapida_desc: "Paratroopers, commandos and special operations under one headquarters, kept at readiness for something nobody has yet defined. Defining it is the interesting part."
 POR_os_comandos: "The Commandos"
 POR_os_comandos_desc: "Disbanded after the revolution for what they did before it, and reformed because an army that cannot do that kind of work has to ask someone else to."
 POR_o_isaf: "Kabul and Kosovo"
 POR_o_isaf_desc: "Portuguese battalions under NATO command in places we have no interest in whatsoever. What we get out of it is an army that has been somewhere, and allies who owe us a favour they will be asked about later."
 POR_a_industria_de_defesa: "The Defense Industry"
 POR_a_industria_de_defesa_desc: "Braco de Prata, OGMA and the Alfeite yard have been kept alive on sentiment and state orders. Given real work, and real protection, they become a constituency of their own."
 POR_o_sirp: "The Intelligence System"
 POR_o_sirp_desc: "Two services, one civil and one military, and a coordinating office that exists mainly so the Assembly has somebody to question. Properly funded, it is what keeps our own affairs out of other people's files."

 ### O MAR PORTUGUES ###
 POR_o_mar_portugues: "The Portuguese Sea"
 POR_o_mar_portugues_desc: "An exclusive economic zone larger than the European Union, patrolled by a navy that can put perhaps four ships to sea at once. The sea is the one thing we have more of than anyone."
 POR_o_arsenal_do_alfeite: "The Alfeite Arsenal"
 POR_o_arsenal_do_alfeite_desc: "The yard can refit anything we own and build very little of it. That is a choice rather than a fact, and it can be unmade."
 POR_as_fragatas_bartolomeu_dias: "The Bartolomeu Dias Frigates"
 POR_as_fragatas_bartolomeu_dias_desc: "Two Karel Doorman hulls bought from the Dutch, modern enough to escort anything we might want escorted and cheap enough that the Assembly approved them without argument."
 POR_os_submarinos_tridente: "The Tridente Submarines"
 POR_os_submarinos_tridente_desc: "Two German boats, air independent, quiet, and completely disproportionate to any threat facing Portugal in European waters. They are not for European waters."
 POR_a_zona_economica_exclusiva: "The Exclusive Economic Zone"
 POR_a_zona_economica_exclusiva_desc: "Fisheries, cables, seabed minerals and the licensing of all three. The maritime industry becomes the constituency that funds the navy that protects the maritime industry."
 POR_a_base_das_lajes: "Lajes Field"
 POR_a_base_das_lajes_desc: "The Americans have used the Azores since the war and will go on paying for the privilege. An airfield in the middle of the Atlantic is worth more to a country with business on the far side of it."
 POR_a_forca_aerea: "The Air Force"
 POR_a_forca_aerea_desc: "Search and rescue, air policing, and a fighter fleet that exists to be counted by NATO. What it lacks entirely is the ability to put anything anywhere."
 POR_os_f_16_mlu: "The F-16 Mid-Life Update"
 POR_os_f_16_mlu_desc: "The airframes are sound and the electronics are twenty years old. Rebuilding them costs a fraction of replacing them and buys another twenty years."
 POR_o_kc_390: "The KC-390"
 POR_o_kc_390_desc: "A Brazilian transport with Portuguese work on the airframe, bought because it can reach Luanda and Maputo without asking anyone for a landing. Nobody says that part aloud."

 ### THE AIR FORCE ###
 POR_forca_aerea: "The Portuguese Air Force"
 POR_forca_aerea_desc: "The running ledger of what the air force can actually reach, and how well it flies when it gets there."
 POR_o_fim_do_alpha_jet: "Retiring the Alpha Jet"
 POR_o_fim_do_alpha_jet_desc: "The attack squadron at Beja is disbanded and its aircraft sold. It is the right decision, it saves real money, and it means that if we ever want that capability again we will be buying it from somebody else."
 POR_a_academia_da_forca_aerea: "The Air Force Academy"
 POR_a_academia_da_forca_aerea_desc: "Sintra trains every pilot we have on aircraft older than most of them. Keeping the training fleet flying costs a fraction of the squadrons and produces the only thing we cannot buy abroad."
 POR_o_p3_cup: "The P-3 Upgrade"
 POR_o_p3_cup_desc: "Five Orions bought secondhand from the Dutch and rebuilt with new sensors. They are the only aircraft in the inventory that can search an ocean, which happens to be the thing we have most of."
 POR_o_c295: "The C-295"
 POR_o_c295_desc: "A dozen light transports to replace the Aviocars, half of them fitted for maritime patrol. OGMA does the work, which keeps a Portuguese aerospace industry in existence for another generation."
 POR_os_merlin: "The Merlins"
 POR_os_merlin_desc: "Twelve EH-101s for search and rescue and for the islands. They are the aircraft that reaches a fishing boat four hundred kilometres out in the Atlantic, and there is no substitute for them anywhere in the inventory."
 POR_monte_real_e_beja: "Monte Real and Beja"
 POR_monte_real_e_beja_desc: "Two airfields kept to a standard that lets somebody else's air force operate from them. That is worth more to our allies than anything we could put in the air ourselves."
 POR_a_tekever: "Tekever"
 POR_a_tekever_desc: "A Portuguese firm building unmanned aircraft that are now watching the Atlantic for half of Europe. It is the first thing this country has exported in a generation that nobody else could have sold us."
 POR_o_policiamento_aereo: "Air Policing"
 POR_o_policiamento_aereo_desc: "Portuguese fighters standing alert over the Baltic and Iceland, intercepting aircraft belonging to a country we have no quarrel with. It is what a small air force does to matter, and the flying hours are real."
 POR_o_caca_de_quinta_geracao: "The Fifth Generation"
 POR_o_caca_de_quinta_geracao_desc: "The F-16s cannot fly forever and the replacement costs more than the air force's entire budget for a decade. Everyone knows what the answer will be. Nobody wants to be the government that signs it."

 ### O QUINTO IMPERIO ###
 POR_o_quinto_imperio: "The Fifth Empire"
 POR_o_quinto_imperio_desc: "Vieira preached it from the pulpit and Pessoa wrote it into verse: after Assyria, Persia, Greece and Rome, a fifth empire, and Portuguese. Neither of them expected it to arrive as a currency board and a mining concession, but it has."
 POR_o_imperio_ultramarino: "The Overseas Empire"
 POR_o_imperio_ultramarino_desc: "We stop calling it intervention. A state with governments of its own making on three continents has interests to defend there, and the law will be written to say so."
 POR_a_conferencia_imperial: "The Imperial Conference"
 POR_a_conferencia_imperial_desc: "Every government that owes us its existence, in one room in Lisbon, asked a question none of them can answer casually: whether the arrangement they live under should have a name and a parliament."
 POR_a_conferencia_imperial_tt: "We have at least §Y2§! Lusophone client governments"
 POR_a_federacao_lusofona: "The Lusophone Federation"
 POR_a_federacao_lusofona_desc: "Those who agreed come in as provinces of a single state, with their armies, their leaders and their seats. Those who refused stay exactly as they were, which is the proof that the ones who agreed were asked.\n\n\n\nFive hundred years late, and by an entirely different route."
 POR_a_federacao_lusofona_tt: "At least §Y1§! of our subjects has §Gagreed§! to federate"
 POR_federacao_category: "The Imperial Conference"
 POR_convocar_a_conferencia: "Summon to the Conference"
 POR_convocar_a_conferencia_desc: "The invitation is not a demand. It is put to the government concerned, and the government concerned answers."
 POR_pressionar_o_subordinado: "Apply Pressure"
 POR_pressionar_o_subordinado_desc: "We remind a reluctant government of what it owes, who pays its army, and how recently it did not exist. It will be asked again, and it will resent us for it."
 portugal.60.t: "The Question of Federation"
 portugal.60.d: "Lisbon proposes that the arrangement under which we live be made permanent and given a name. We would send members to a federal parliament, our army would become a component of a federal army, and our foreign policy would be made in a city we do not live in.\n\n\n\nWhat is being offered is a share in something larger. What is being asked is the last thing we have that is entirely ours."
 portugal.60.a: "Accede to the federation"
 portugal.60.b: "We will remain sovereign"
 portugal.61.t: "They Have Agreed"
 portugal.61.d: "The delegation has accepted the terms. Their parliament will ratify, because their parliament is composed of people who understand what happened to the last government that did not."
 portugal.61.a: "Welcome them"
 portugal_news.5.t: "Portugal Summons an Imperial Conference"
 portugal_news.5.d: "Lisbon has invited the governments of several Lusophone states to a conference on what Portuguese officials are calling a community of destiny. Observers note that every government invited came to power with Portuguese assistance, and that none of them has declined to attend."
 portugal_news.5.a: "A community of destiny"
 portugal_news.6.t: "The Lusophone Federation Is Proclaimed"
 portugal_news.6.d: "Portugal and the states that accepted its terms have proclaimed a federal union, pooling their armies and foreign policy under a parliament sitting in Lisbon. States that declined remain formally sovereign.\n\n\n\nIt is the largest voluntary transfer of sovereignty since the European treaties, and almost nobody outside the federation believes the word voluntary."
 portugal_news.6.a: "Five centuries late"
 ### THE IDEOLOGICAL QUESTION ###
 POR_ideologia_shortcut: "Ideology"
 POR_politica_shortcut: "Policy"
 POR_a_questao_ideologica: "The Ideological Question"
 POR_a_questao_ideologica_desc: "A quarter of a century after the revolution the parties agree on the constitution, the currency, the alliance and the budget. What is left to argue about is everything else, and the country is about to find out how much that is."
 POR_ideological_development_up_tt: "£drift_defence_texticon  §YIdeological Development§!: §G+[?POR_ideo_add]§!"
 POR_ideological_development_down_tt: "£drift_defence_texticon  §YIdeological Development§!: §R-[?POR_ideo_sub]§!"
 POR_ruling_party_has_support_tt: "[Root.GetRulingParty] polls above §Y15%%§!"
 POR_has_an_opposition_tt: "Some party outside the government has support worth taking"
 POR_revolt_has_support_tt: "An outlook outside the government holds more than §Y34%%§! of the country"
 POR_the_left_governs_tt: "The £POR_anarchist_communism CDU, £POR_non_aligned_socialist_democrat Bloco de Esquerda, £POR_non_aligned_communism PCTP or £POR_emerging_communism POUS is in government"
 POR_the_atlanticists_govern_tt: "The £POR_western_conservative PSD, £POR_western_liberal Nos Cidadaos or £POR_western_social_democrat PS is in government"
 POR_the_national_right_governs_tt: "The £POR_non_aligned_conservative CDS-PP, £POR_Nat_Populism PNR, £POR_Nat_Autocracy Exercito Portugues or £POR_nationalist_monarchist Braganca is in government"
 POR_unions_are_behind_us_tt: "The §Ylabour unions§! stand with the government"
 POR_the_streets_are_out_tt: "§YProtest§! is above §Y25§!"

 ### THE BATTLE OF IDEAS ###
 POR_o_combate_das_ideias: "The Battle of Ideas"
 POR_o_combate_das_ideias_desc: "Portuguese politics is conducted by four families who went to the same law faculty and disagree about the distribution of posts. Widening that into a disagreement about the country is a deliberate act, and it is about to be committed."
 POR_a_imprensa_partidaria: "The Party Press"
 POR_a_imprensa_partidaria_desc: "Every serious paper acquires a line, every line acquires a proprietor, and the reader learns to work out what happened by reading two of them. It raises the temperature of everything and nobody can now afford to stop."
 POR_os_institutos_de_ideias: "The Institutes"
 POR_os_institutos_de_ideias_desc: "Foundations with Latin names and bank funding, publishing papers that arrive in ministries before the ministers have had the argument. The policy is decided outside the building and ratified inside it."
 POR_a_juventude_militante: "The Militant Youth"
 POR_a_juventude_militante_desc: "The party youth wings stop being a route to a safe seat and start being the reason a rally has a thousand people in it. Their elders find them useful, and then find them difficult."
 POR_a_universidade_politica: "The Political University"
 POR_a_universidade_politica_desc: "The faculties that trained the administrators of the Estado Novo and then the cadres of the revolution take a third turn. Whoever holds the lecture halls holds the next generation of permanent secretaries."
 POR_a_hegemonia_cultural: "Cultural Hegemony"
 POR_a_hegemonia_cultural_desc: "The point is not to win the election. The point is to make the other side's position sound like something no decent person would say aloud, and then win every election."
 POR_o_consenso_nacional: "The National Consensus"
 POR_o_consenso_nacional_desc: "The party leaders meet without cameras and agree that some questions are above politics. It is the most cynical thing any of them does and it is probably what keeps the country governable."
 POR_a_causa_dos_oprimidos: "The Cause of the Oppressed"
 POR_a_causa_dos_oprimidos_desc: "Portugal discovers that its foreign entanglements are not entanglements at all but solidarity with the wretched of the earth. The wretched of the earth are not consulted, but they are, on the whole, glad of the rifles."
 POR_a_causa_dos_oprimidos_effect_tt: "§YForeign clients§! who are outgunned or outlawed pay §G25%§! more in influence and rewards"

 ### PUBLIC OPINION ###
 POR_a_opiniao_publica: "Public Opinion"
 POR_a_opiniao_publica_desc: "Polling arrives in Portuguese politics late and then all at once. Within a decade no party leader makes a speech that has not been tested on four hundred people in Setubal first."
 POR_a_maquina_do_partido: "The Party Machine"
 POR_a_maquina_do_partido_desc: "Membership rolls, local branches, a name on every parish council and a favour owed in every one. It is not glamorous and it decides more elections than any manifesto."
 POR_a_mobilizacao_das_ruas: "Taking to the Streets"
 POR_a_mobilizacao_das_ruas_desc: "The government discovers that a crowd of its own is worth more than a majority in the chamber. It is also a crowd, and crowds do not go home when the speeches end."
 POR_a_captura_do_centro: "Capturing the Centre"
 POR_a_captura_do_centro_desc: "The opposition's least committed voters are identified, addressed in their own language, and offered most of what they wanted from the other side. They come across, and they bring their opinions with them."
 POR_a_agitacao_permanente: "Permanent Agitation"
 POR_a_agitacao_permanente_desc: "Government by campaign. There is always a demonstration next Saturday, always an enemy named on Thursday, and the country never quite returns to room temperature."
 POR_a_greve_geral: "The General Strike"
 POR_a_greve_geral_desc: "The two confederations call the same strike on the same day for the first time since the seventies. The trains stop, the ports stop, and the government finds out exactly who it governs with."
 POR_o_estado_de_excepcao: "The State of Exception"
 POR_o_estado_de_excepcao_desc: "Public order legislation drafted for football crowds is discovered to cover political assembly. The streets empty within a fortnight, and something in the republic does not come back."
 POR_a_ruptura_revolucionaria: "The Revolutionary Rupture"
 POR_a_ruptura_revolucionaria_desc: "What a quarter of the country believes becomes what the state is, on a Tuesday, without an election. The side that held the chair yesterday does not accept it, and it has men who were soldiers."

 ### INTERNATIONAL SOLIDARITY ###
 POR_a_solidariedade_internacional: "International Solidarity"
 POR_a_solidariedade_internacional_desc: "A small country on the edge of Europe has one real foreign policy question: whose argument is it joining. Lisbon has spent five centuries answering that with geography and is about to try answering it with ideology."
 POR_o_alinhamento_ideologico: "Ideological Alignment"
 POR_o_alinhamento_ideologico_desc: "The foreign ministry is instructed to stop treating every capital the same. Which capitals get the new treatment depends entirely on who won the last election at home, which is the point and also the flaw."
 POR_o_eixo_de_pequim: "The Beijing Axis"
 POR_o_eixo_de_pequim_desc: "Portugal handed back its last Asian territory in 1999 and kept the relationship. A left government in Lisbon finds Beijing willing to lend without lectures, and discovers what the lectures were for."
 POR_a_frente_atlantica: "The Atlantic Front"
 POR_a_frente_atlantica_desc: "The alliance that has underwritten Portuguese security since 1949, restated as a choice rather than an inheritance. Lajes stays open, the technology transfer improves, and the price is never written down."
 POR_o_bloco_soberanista: "The Sovereigntist Bloc"
 POR_o_bloco_soberanista_desc: "A correspondence between parties that all describe themselves as the last defenders of their own nation, conducted in careful English. That it works at all is the surprise."
 POR_o_tratado_de_macau: "The Macau Arrangement"
 POR_o_tratado_de_macau_desc: "Fifty years of guaranteed Portuguese law in a Chinese city, and a hundred thousand passport holders. Lisbon stops treating it as a loose end and starts treating it as a door."
 POR_a_via_dos_brics: "The BRICS Road"
 POR_a_via_dos_brics_desc: "A European Union member applying to the club of countries organised against European lecturing. Brasilia thinks it is funny, Brussels does not, and the trade figures make the case on their own."
 POR_a_internacional_lusofona: "The Lusophone International"
 POR_a_internacional_lusofona_desc: "Nine countries, two hundred and eighty million people, one language and no common interest whatsoever. Lisbon proposes to supply the interest."
 POR_a_doutrina_de_lisboa: "The Lisbon Doctrine"
 POR_a_doutrina_de_lisboa_desc: "Stated plainly for the first time: Portugal has legitimate concerns wherever Portuguese is spoken, and the means to act on them are a domestic matter. Nobody in Brussels asked for the clarification."
 POR_a_doutrina_de_lisboa_effect_tt: "Reduces §YEuropean exposure§! by §G10§! and puts the doctrine on the record"

 ### THE RUPTURE ###
 portugal_news.8.t: "Power Changes Hands in Lisbon"
 portugal_news.8.d: "The government of Portugal has been replaced outside the electoral calendar, by a movement that claims to represent a majority the ballot box was not measuring. Its opponents have withdrawn from the capital and are no longer answering the ministry of defence.\n\n\n\nEuropean foreign ministries have issued the statement they keep for these occasions, in which the word democratic appears four times and the word recognition does not appear at all."
 portugal_news.8.a: "The argument is over"
 ### THE SCHOOLS OF THE ARMY ###
 POR_a_escola_de_doutrina: "The School of Doctrine"
 POR_a_escola_de_doutrina_desc: "Twenty-six thousand professional soldiers and no settled answer to what they are for. The Instituto de Estudos Superiores Militares is asked to produce one, and the answer will determine every procurement decision for a generation."
 POR_a_defesa_elastica: "Defence in Depth"
 POR_a_defesa_elastica_desc: "The school that assumes the enemy gets in and plans for what happens next. Ground is traded, the line bends, and the counterattack comes at a place the attacker chose to reach and not to hold."
 POR_a_guerra_ligeira: "The Light Warfare School"
 POR_a_guerra_ligeira_desc: "Commandos, paratroopers, marines and mountain troops, moved by whatever will carry them and supplied by whatever is already there. It suits a country that cannot afford weight and keeps finding itself a long way from home."
 POR_o_choque_blindado: "The Armoured Shock School"
 POR_o_choque_blindado_desc: "A brigade of Leopards and Pandurs that exists to punch a hole and be somewhere else by evening. It is the most expensive answer on the table and the only one that impresses allies."
 POR_o_estado_maior_general: "The General Staff"
 POR_o_estado_maior_general_desc: "Whichever school wins, somebody has to write the orders. The staff college is rebuilt around the doctrine actually chosen rather than the one in the last set of manuals."

 ### THE SCHOOLS OF THE NAVY ###
 POR_a_escola_naval: "The Naval School"
 POR_a_escola_naval_desc: "An exclusive economic zone the size of a continent, a fleet of eleven serious hulls, and a professional argument about which eleven they should be. The Escola Naval at Alfeite settles it, slowly."
 POR_a_esquadra_de_superficie: "The Surface Squadron"
 POR_a_esquadra_de_superficie_desc: "Frigates that can screen a task group, work with allies, and show a flag in a harbour where a flag is what is needed. Expensive per hull and the only ships anyone else counts."
 POR_a_negacao_do_mar: "Sea Denial"
 POR_a_negacao_do_mar_desc: "The school that gives up on controlling the Atlantic and concentrates on making it unusable to anyone else. Two submarines that nobody can find are worth more than six frigates everyone can."
 POR_o_navio_polivalente: "The Multipurpose Ship"
 POR_o_navio_polivalente_desc: "A hull that carries a battalion, a hospital, six helicopters and a landing dock, argued about for twenty years before anyone cuts steel. It turns the navy from a coastguard into a way of arriving somewhere."
 POR_a_patrulha_oceanica: "Ocean Patrol"
 POR_a_patrulha_oceanica_desc: "Cheap hulls built at Viana do Castelo to do the work nobody writes doctrine about: fisheries, search and rescue, smuggling and the endless business of being seen in one's own water."
 POR_o_comando_naval: "Naval Command"
 POR_o_comando_naval_desc: "Sensors, datalinks and a command centre that can hold a picture of the whole Atlantic approach. Portugal cannot fill that ocean with ships, so it fills it with information instead."

 ### THE SCHOOLS OF THE AIR FORCE ###
 POR_o_caca_multifuncao: "The Multirole Fighter"
 POR_o_caca_multifuncao_desc: "One airframe that intercepts in the morning and drops ordnance in the afternoon, at the price of being second best at both. For an air force of this size the argument answers itself, which does not stop it being had."
 POR_a_superioridade_aerea: "Air Superiority"
 POR_a_superioridade_aerea_desc: "The school that says the first job of an air force is to own the sky and everything else is a consequence. It buys fewer aircraft, trains them harder, and asks the army to wait."
 POR_a_guerra_de_drones: "Drone Warfare"
 POR_a_guerra_de_drones_desc: "Tekever builds airframes in Ilhavo that loiter for twelve hours and cost less than a helicopter's engine. The air force resists them until the navy starts ordering them directly."
 ### INTERVENTION ###
 POR_intervencao_shortcut: "Intervention"
 POR_intervencao: "The Instruments"
 POR_intervencao_desc: "The running ledger of what our services can see, reach and do without being seen doing it."
 POR_intervencao_category: "Intervention"
 POR_a_intervencao: "Intervention"
 POR_a_intervencao_desc: "A country of ten million with a diplomatic service, a language spoken by two hundred and eighty million, and no instrument between a démarche and a war. This branch builds the instruments."
 POR_needs_POR_a_realpolitik_lusofona_tt: "We have adopted §YLusophone Realpolitik§!"
 POR_holds_a_network_tt: "We hold a §Ynetwork§! worth more than §Y30%%§! in some Lusophone state"
 POR_holds_a_client_tt: "We are running at least one §Yclient§!"
 POR_ready_for_a_directed_rising_tt: "Somewhere in the Lusophone world we hold §Y40§! network strength, both §Ycivilian§! and §Yarmy§! infiltration, and more than §Y10%%§! influence"
 POR_madrid_is_ready_tt: "Spain is §Yisolated or unstable§!, we hold §Y60§! network strength there with §Yboth§! infiltrations, our §Yideological development§! is above §Y60§!, and we are already running §Ytwo clients§!"
 POR_galiza_is_ready_tt: "Spain is §Yat war with itself§!, or the government we installed sits in Madrid"

 ### THE INSTRUMENTS ###
 POR_o_sied: "The SIED"
 POR_o_sied_desc: "Portugal has had no foreign intelligence service worth the name since the political police were dissolved, on the reasonable grounds that the last one had been used on Portuguese people. The new one is written to a narrower remit, which is a promise about premises rather than about conduct."
 POR_o_sied_agency_tt: "Establishes the §YServico de Informacoes Estrategicas de Defesa§!"
 POR_a_seccao_de_operacoes: "The Operations Section"
 POR_a_seccao_de_operacoes_desc: "The part of the service that does things rather than reads about them. It has no statutory basis, a budget line called technical support, and a corridor of its own."
 POR_a_diplomacia_economica: "Economic Diplomacy"
 POR_a_diplomacia_economica_desc: "A trade delegation attached to every embassy in the Lusophone world, staffed by people the banks pay and the ministry accredits. Nobody has to be told which is which."
 POR_a_rede_civil: "The Civil Network"
 POR_a_rede_civil_desc: "Customs officers, telephone engineers, the second secretary at the central bank. None of them thinks of himself as an agent and every one of them takes the call."
 POR_a_rede_militar: "The Military Network"
 POR_a_rede_militar_desc: "Half the general staff of four countries did their staff course at Pedroucos and still writes at Christmas. The correspondence has been formalised."
 POR_o_destacamento_de_accoes_especiais: "The Special Actions Detachment"
 POR_o_destacamento_de_accoes_especiais_desc: "Naval special forces trained for ship boarding and hostage recovery, and available at four hours' notice for anything the operations section can describe as either."
 POR_a_concessao_mineira: "The Mining Concession"
 POR_a_concessao_mineira_desc: "A thirty-year licence, a road that happens to reach a port, and a share of the revenue that is settled in Lisbon. The host government signs it because the alternative concession is Chinese."

 ### NEO-COLONIALISM ###
 POR_o_pronunciamento_dirigido: "The Directed Rising"
 POR_o_pronunciamento_dirigido_desc: "The difference between funding a coup and running one is whether our people are in the room when it happens. From here they are."
 POR_operation_pronunciamento: "Directed Rising"
 POR_operation_pronunciamento_desc: "Our officers inside the target's army move at the same hour as our people inside its ministries. The rising has a plan, a cabinet and a radio station before the loyalists have an order."
 POR_operation_pronunciamento_unlocked_tt: "Unlocks the §YDirected Rising§! operation against any state where we hold a network"
 POR_operation_pronunciamento_outcome_tt: "Starts a §Rcivil war§! in the target, with the rebels carrying our politics"
 POR_a_guerra_por_procuracao: "War by Proxy"
 POR_a_guerra_por_procuracao_desc: "Two governments with a border, a grievance and no money. We supply the money, to the one we do not intend to keep."
 POR_atear_a_fogueira: "Fan the Flames"
 POR_atear_a_fogueira_desc: "Arms, a loan and a briefing on what the neighbours are said to be planning. The government we have been cultivating discovers an urgent territorial question."
 POR_atear_a_fogueira_effect_tt: "The client government acquires an §Rurgent territorial question§! with one of its neighbours"
 POR_atear_a_fogueira_tt: "We hold at least §Y4 billion§! in the treasury"
 POR_o_acordo_de_defesa: "The Defence Agreement"
 POR_o_acordo_de_defesa_desc: "A standing agreement on training, basing and overflight, signed by governments that owe us their existence. The word alliance appears nowhere in it."
 POR_o_protectorado_economico: "The Economic Protectorate"
 POR_o_protectorado_economico_desc: "The currency is pegged to ours, the customs service is advised by ours, and the sovereign debt is held by our banks. Sovereignty is intact in every particular that can be photographed."

 ### THE OPEN HAND ###
 POR_os_nacionais_em_perigo: "Nationals at Risk"
 POR_os_nacionais_em_perigo_desc: "There are Portuguese passport holders in every country on this list, most of them born there. Their safety is a matter of law, and the law is unhelpfully silent on what a rescue may bring ashore with it."
 POR_evacuar_os_nossos: "Evacuate Our Nationals"
 POR_evacuar_os_nossos_desc: "Two frigates, a landing dock and a battalion of marines, sent to a coast where the shooting has started. The evacuation is genuine. So is the garrison that stays behind to secure the beachhead."
 POR_evacuar_os_nossos_tt: "We hold at least §Y8 billion§! in the treasury"
 POR_a_intervencao_directa: "Direct Intervention"
 POR_a_intervencao_directa_desc: "The pretence is dropped. What was an evacuation is a deployment, what was a concession is a claim, and the general staff is asked for plans rather than assessments."
 POR_o_golpe_de_madrid: "The Madrid Operation"
 POR_o_golpe_de_madrid_desc: "Spain has been the answer to every Portuguese strategic question since 1143, and the answer has always been no. This is the file that assumes otherwise, and everyone who has read it understands that reading it is already a decision."
 POR_o_golpe_de_madrid_decision: "The Madrid Operation"
 POR_o_golpe_de_madrid_decision_desc: "Eighteen months, twenty billion, and every asset we hold inside a fellow member of NATO and the European Union. If it fails, it is the end of Portugal as a country other countries talk to."
 POR_o_golpe_de_madrid_decision_tt: "We hold at least §Y20 billion§! in the treasury"
 POR_golpe_de_madrid_aborted_tt: "§RSpain was already at war with itself when the hour came, and the operation was stood down§!"
 POR_a_galiza: "Galicia"
 POR_a_galiza_desc: "Four provinces that speak a language which is either a dialect of Portuguese or its sister, depending on which university is asked. The question has been academic for five hundred years and is about to stop being."
 POR_reclamar_a_galiza: "Reclaim Galicia"
 POR_reclamar_a_galiza_desc: "The Galician language academies are invited to Lisbon, the Spanish state is invited to consider its position, and the frontier posts at Valenca and Tui are removed overnight."

 ### THE EVACUATION ###
 portugal.41.t: "The Beachhead Stays"
 portugal.41.d: "The fighting has stopped and the government that came out of it is one we helped into office. The question of the province our marines are still holding has been raised by nobody, and the foreign ministry has been instructed to raise it with nobody either.\n\n\n\nThe garrison is being rotated rather than withdrawn."
 portugal.41.a: "Nobody asked"
 portugal.42.t: "They Want It Back"
 portugal.42.d: "The war is over and the side we did not back has won it. Its first note to Lisbon is polite, cites the evacuation agreement by paragraph number, and asks when our forces will be leaving the province they evacuated into.\n\n\n\nThere is no legal answer to the note. There is only a decision."
 portugal.42.a: "Withdraw the garrison"
 portugal.42.b: "The note goes unanswered"
 portugal_news.9.t: "Fighting in Spain"
 portugal_news.9.d: "A rising has broken out across Spain, led by officers and officials whose politics are, by a coincidence that nobody in Brussels believes, identical to those of the government in Lisbon. Spanish state television is off the air in four regions.\n\n\n\nThe Portuguese foreign ministry has expressed its concern and its hope for a swift return to constitutional order."
 portugal_news.9.a: "Nine hundred years of the same border"
 portugal_news.10.t: "Portuguese Marines Land"
 portugal_news.10.d: "Portuguese warships have put marines ashore to evacuate Portuguese passport holders from a country at war with itself. The operation is being conducted under the law of the sea and the evacuation provisions of a bilateral agreement signed in better times.\n\n\n\nThe marines have secured the port, the airfield, the coast road and the province they are all in."
 portugal_news.10.a: "A humanitarian operation"
 portugal_news.11.t: "Galicia Joins Portugal"
 portugal_news.11.d: "The four Galician provinces have been incorporated into the Portuguese Republic. The frontier posts at Valenca and Tui were removed overnight and the language academies of both countries have issued a joint statement which carefully avoids saying whether one language or two has been reunited.\n\n\n\nNo European government has recognised the transfer. Several have declined to say that they will not."
 portugal_news.11.a: "The question was academic"
 ### THE SECOND SCHOOLS ###
 POR_doutrina_terrestre: "The Land Doctrine"
 POR_doutrina_terrestre_desc: "What the army decided a war looks like, and what it bought on the strength of that decision."
 POR_doutrina_naval: "The Naval Doctrine"
 POR_doutrina_naval_desc: "What the navy decided the Atlantic is for, and the hulls that follow from it."
 POR_doutrina_aerea: "The Air Doctrine"
 POR_doutrina_aerea_desc: "What the air force decided its aircraft are for, once it stopped buying whatever was on offer."
 POR_a_defesa_do_territorio: "Territorial Defence"
 POR_a_defesa_do_territorio_desc: "The elastic defence taken to its conclusion: prepared positions, surveyed artillery and a mainland that costs more to take than it is worth. It is the cheapest form of deterrence and the one nobody gets promoted for."
 POR_a_contra_subversao: "Counter-Subversion"
 POR_a_contra_subversao_desc: "Thirteen years in Africa produced a body of doctrine on fighting people who do not wear uniforms, and then the country spent thirty years not reading it. Afghanistan, Lebanon and the Central African Republic put it back on the syllabus."
 POR_a_batalha_decisiva: "The Decisive Battle"
 POR_a_batalha_decisiva_desc: "Find the seam, put everything through it, and be somewhere the enemy did not plan for by nightfall. It asks for self-propelled fires, fuel and a staff that can write orders faster than the other side can read them."
 POR_a_esquadra_de_combate: "The Fighting Squadron"
 POR_a_esquadra_de_combate_desc: "Hulls that can hold an air-defence picture over a task group and shoot at something four hundred kilometres away. Every one of them costs what four patrol vessels cost, and the argument about whether that is the right trade has been running since the eighteenth century."
 POR_os_misseis_de_cruzeiro: "The Missile Boats"
 POR_os_misseis_de_cruzeiro_desc: "The other answer to a small navy: do not try to hold the sea, just make certain nobody else can use it. A cheap hull with an expensive weapon, hiding in water Portugal has charted and nobody else has."
 POR_o_porta_aeronaves: "The Aviation Ship"
 POR_o_porta_aeronaves_desc: "A deck that can fly fixed-wing aircraft, five hundred years after the last time Portuguese ships decided where in the world anything happened. The budget for it does not exist; that has never stopped the argument."
 POR_o_tiro_de_longo_alcance: "The Long Shot"
 POR_o_tiro_de_longo_alcance_desc: "Radar, datalink and a missile that arrives before the other pilot knows the engagement began. It is not flying in any sense a pilot would recognise, and it wins."
 POR_o_apoio_aereo_proximo: "Close Air Support"
 POR_o_apoio_aereo_proximo_desc: "The air force is reminded, at some length and by the army, that its purpose includes being overhead when a Portuguese company is in contact three thousand kilometres from Lisbon."
 POR_a_ponte_aerea: "The Air Bridge"
 POR_a_ponte_aerea_desc: "Tankers, transports and a radar picture that can be flown to wherever it is needed. An expeditionary country that cannot move itself is a country with opinions rather than a policy."
 ### AS CAMPANHAS ###
 POR_campanhas_shortcut: "Campaigns"
 POR_as_campanhas: "The Campaigns"
 POR_as_campanhas_desc: "The instruments exist. What follows is the list of places to use them, and every one of them has a specific quarrel Portugal can be useful in."
 POR_needs_POR_a_intervencao_tt: "We have built the §Yinstruments of intervention§!"

 ### ANGOLA ###
 POR_os_observadores_do_estoril: "The Estoril Observers"
 POR_os_observadores_do_estoril_desc: "Portugal, the United States and Russia observe the Angolan peace process, which means Portugal sits in a room with both sides of a war and is trusted by neither. Both sides talk to it anyway, because there is nobody else who speaks to both."
 POR_os_diamantes_das_lundas: "The Diamonds of the Lundas"
 POR_os_diamantes_das_lundas_desc: "UNITA pays for its war with stones dug out of the Lunda riverbeds and sold through Antwerp. The Security Council outlawed the trade in 1998, which raised the price and changed nothing else. Somebody has to certify the paperwork."
 POR_o_memorando_de_luena: "The Luena Memorandum"
 POR_o_memorando_de_luena_desc: "Savimbi is killed in the bush in February and the war is over by April, on terms written in six weeks by men who had been shooting at each other for twenty-seven years. Whoever brokered it owns a share of the peace."
 POR_o_memorando_de_luena_effect_tt: "Portugal is the §Yguarantor§! of the Angolan settlement, and is owed by whichever side kept its army"
 POR_lundas_tt: "We hold a §Ynetwork§! inside UNITA"
 POR_luena_tt: "We hold a §Ynetwork above 40%%§! in §Yeither§! Angolan camp"

 ### GUINEA-BISSAU ###
 POR_a_embaixada_em_bissau: "The Embassy in Bissau"
 POR_a_embaixada_em_bissau_desc: "Every officer above major did his staff course in Lisbon, every minister's children are at school in Portugal, and the embassy is the largest building in the city that still has a working generator."
 POR_os_donos_da_cocaina: "The Owners of the Cocaine"
 POR_os_donos_da_cocaina_desc: "Two tonnes a week come ashore in the Bijagos and leave again for Europe, and the men who arrange it wear the uniform of the armed forces. Portugal can prosecute this or it can know about it, and knowing about it buys more."
 POR_a_reforma_do_sector_de_seguranca: "Security Sector Reform"
 POR_a_reforma_do_sector_de_seguranca_desc: "A European mission to pension off the general staff and professionalise what is left. It is the correct policy, it is what the country asked for, and every man it retires becomes available to whoever is paying."
 POR_a_reforma_do_sector_de_seguranca_effect_tt: "Portugal §Yrebuilds§! the Bissau officer corps, and knows where every one of them sleeps"
 POR_bissau_network_tt: "We hold a §Ynetwork above 30%%§! in Guinea-Bissau"
 POR_bissau_reform_tt: "We are the §Ylargest foreign influence§! in Guinea-Bissau, above §Y30%%§!"

 ### MOZAMBIQUE ###
 POR_a_barragem_de_cahora_bassa: "Cahora Bassa"
 POR_a_barragem_de_cahora_bassa_desc: "The largest dam in southern Africa, built by Portugal in 1974 and still owned by it a quarter of a century after the country around it became independent. Maputo would like it back. Everything else follows from the price."
 POR_a_cooperacao_tecnico_militar: "Technical-Military Cooperation"
 POR_a_cooperacao_tecnico_militar_desc: "Portuguese instructors at Boane and Mozambican officers at Pedroucos, under an agreement signed so quietly that the parliament in Lisbon was told afterwards."
 POR_o_gas_do_rovuma: "The Rovuma Gas"
 POR_o_gas_do_rovuma_desc: "The largest gas find in a generation, offshore of the poorest province in the country, and an insurgency ashore that started the year the platforms were ordered. Nobody involved thinks those two facts are unrelated."
 POR_maputo_network_tt: "We hold a §Ynetwork above 30%%§! in Mozambique"
 POR_rovuma_tt: "We are the §Ylargest foreign influence§! in Mozambique, above §Y30%%§!"

 ### EAST TIMOR ###
 POR_o_portugues_em_timor: "Portuguese in Timor"
 POR_o_portugues_em_timor_desc: "A country where five per cent speak Portuguese chooses it as an official language, because the generation that led the resistance conspired in it and the generation that occupied them did not. Lisbon pays for the teachers."
 POR_a_guarda_em_dili: "The Guard in Dili"
 POR_a_guarda_em_dili_desc: "The army dismisses a third of itself, the third that was dismissed goes to the hills with its weapons, and Dili burns. Portuguese gendarmes land within a fortnight and stay for six years."
 POR_o_mar_de_timor: "The Timor Sea"
 POR_o_mar_de_timor_desc: "A maritime boundary drawn to favour Canberra, a gas field worth more than the country's entire economy, and a conciliation at The Hague that nobody expected the small side to win."
 POR_dili_network_tt: "We hold a §Ynetwork above 30%%§! in East Timor"
 POR_timor_sea_tt: "We are the §Ylargest foreign influence§! in East Timor, above §Y30%%§!"

 ### EQUATORIAL GUINEA ###
 POR_a_lusofonia_de_malabo: "The Lusophony of Malabo"
 POR_a_lusofonia_de_malabo_desc: "A country where almost nobody speaks Portuguese makes it an official language and joins the CPLP, in exchange for the community declining to discuss its prisons. Both sides know exactly what the transaction is."
 POR_o_governo_de_severo_moto: "The Severo Moto Government"
 POR_o_governo_de_severo_moto_desc: "A government-in-exile in Madrid, sentenced to a hundred years in absentia, and a standing invitation to anyone who can put it on a plane to Malabo."
 POR_o_dossie_de_black_beach: "The Black Beach File"
 POR_o_dossie_de_black_beach_desc: "Sixty-four mercenaries arrested in Harare on their way to overthrow Obiang, financed from London, and a trial that named everyone except the people who paid. The file is still open and Lisbon has a copy."
 POR_o_dossie_de_black_beach_effect_tt: "Portugal holds the §Ynames§! of everyone who has tried this before, and what they got wrong"
 POR_malabo_network_tt: "We hold a §Ynetwork above 30%%§! in Equatorial Guinea"
 POR_black_beach_tt: "We are the §Ylargest foreign influence§! in Equatorial Guinea, above §Y30%%§!"

 ### CABINDA ###
 POR_o_tratado_de_simulambuco: "The Treaty of Simulambuco"
 POR_o_tratado_de_simulambuco_desc: "In 1885 the princes of Cabinda placed themselves under Portuguese protection as a separate territory from Angola. Every Cabindan separatist argument since has begun with that sentence, and Lisbon has spent a century declining to finish it."
 POR_a_flec_de_cabinda: "The FLEC of Cabinda"
 POR_a_flec_de_cabinda_desc: "A separatist front split into factions, an enclave producing most of Angola's oil, and a Portuguese-speaking exile leadership in Paris and Lisbon that has been waiting thirty years for a telephone call."
 POR_a_republica_de_cabinda: "The Republic of Cabinda"
 POR_a_republica_de_cabinda_desc: "Sixty thousand barrels a day, seven hundred thousand people, and a border with Angola that only exists on the maps Portugal drew. It is declared on a morning when Luanda is looking somewhere else."
 POR_flec_tt: "We hold a §Ynetwork above 30%%§! in Angola"
 POR_cabinda_ready_tt: "Angola is §Yat war with itself§! or §Ylosing§! a war"

 ### CAPE VERDE ###
 POR_o_acordo_cambial: "The Exchange Rate Agreement"
 POR_o_acordo_cambial_desc: "The escudo is pegged to the Portuguese escudo and then to the euro, guaranteed by a credit line from Lisbon. It is the single most consequential thing Portugal does for any of these countries and it never makes a newspaper."
 POR_a_parceria_especial: "The Special Partnership"
 POR_a_parceria_especial_desc: "Portugal spends its European presidency arranging a status for Cape Verde that is not membership and not aid, and which nobody else in the Union has. It is drafted in Lisbon and signed in Brussels."
 POR_o_estado_associado: "The Associated State"
 POR_o_estado_associado_desc: "A currency issued against Portuguese reserves, a diaspora larger than the resident population, and a free movement arrangement. At some point somebody is going to ask what the difference is."
 POR_o_estado_associado_effect_tt: "Cape Verde becomes an §Yassociated state§! in everything but the word"
 POR_praia_network_tt: "We hold a §Ynetwork above 30%%§! in Cape Verde"
 POR_praia_associated_tt: "We are the §Ylargest foreign influence§! in Cape Verde, above §Y50%%§!"

 ### SAO TOME ###
 POR_a_zona_de_desenvolvimento_conjunto: "The Joint Development Zone"
 POR_a_zona_de_desenvolvimento_conjunto_desc: "An oil block shared with Nigeria on terms of sixty to forty in Abuja's favour, signed by a country of a hundred and forty thousand people with no lawyers of its own. Lisbon supplies the lawyers."
 POR_o_dezasseis_de_julho: "The Sixteenth of July"
 POR_o_dezasseis_de_julho_desc: "The president is abroad, a major with veterans of the Buffalo Battalion behind him takes the radio station, and a week later everybody agrees it did not really happen. Somebody made the telephone calls that ended it."
 POR_a_estacao_naval_do_golfo: "The Gulf Naval Station"
 POR_a_estacao_naval_do_golfo_desc: "One island in the middle of the Gulf of Guinea, at the point where every tanker leaving West Africa has to pass. Every navy in the world has asked about it. One of them speaks the language."
 POR_sao_tome_network_tt: "We hold a §Ynetwork above 30%%§! in Sao Tome"
 POR_gulf_station_tt: "We are the §Ylargest foreign influence§! in Sao Tome, above §Y50%%§!"
 ### BACKING A SIDE ###
 POR_commit_to_a_side_tt: "Portugal is §Ycommitted§!. If this side wins we take an §Ginfluence share, a network and a trading position§! in whatever it becomes; if it loses we are §Rthe power that backed the losers§!"
 portugal.70.t: "Our Side Won"
 portugal.70.d: "The war we were careful never to admit being in has ended in favour of the people we were careful never to admit paying. The new government's first foreign visit is to Lisbon, its finance ministry is advised by people we seconded, and the concessions signed under the old one are being reviewed in our favour.\n\n\n\nNobody is going to write any of that down."



Nobody is going to write any of that down."
 portugal.70.a: "The correct investment"
 portugal.71.t: "We Backed the Losers"
 portugal.71.d: "The side we supplied has been destroyed and the side we supplied against is in the capital, going through the filing cabinets. Some of what they will find has our letterhead on it.\n\n\n\nEvery position we held in that country is now held by whoever paid for the winners."



Every position we held in that country is now held by whoever paid for the winners."
 portugal.71.a: "Deniability was always the weaker half of the plan"
 ### THE RAID AND THE SIDE ###
 POR_operation_falsa_bandeira: "False Flag"
 POR_operation_falsa_bandeira_desc: "A barracks, a customs post or a ministry annexe goes up at four in the morning, and the material left in the wreckage belongs to somebody the government already distrusts. It starts nothing by itself. It makes what comes next believable."
 POR_operation_falsa_bandeira_outcome_tt: "Leaves a §Yusable pretext§! in the target for §Y180 days§!, and may be §Rtraced back to us§!"
 POR_operation_pronunciamento_cost_tt: "We hold at least §Y12 billion§! in the treasury"
 POR_purgar_a_rede: "Purge the Portuguese Network"
 POR_purgar_a_rede_desc: "Ninety days of arrests, expulsions and retirements, beginning with the officers who went to staff college in Lisbon. It costs the government stability it does not have and the economy contracts that were signing themselves. It is still cheaper than the alternative."
 POR_contra_espionagem_category: "Counter-Intelligence"
 portugal.72.t: "Explosion at the Barracks"
 portugal.72.d: "Something went up before dawn and the wreckage is being photographed by people who already know what they want it to mean. The material recovered from the scene is foreign and it is not new.\n\n\n\nThe question in every ministry this morning is not who did it. It is who benefits, and every faction has a different answer."
 portugal.72.a: "Somebody wanted this"
 portugal.72.b: "The trail runs to Lisbon"
 portugal.73.t: "Which Government Do We Recognise?"
 portugal.73.d: "The rising we arranged is under way and both sides have a foreign ministry, a radio station and a claim. Lisbon now has to say which one it recognises, and it has to say it this week.\n\n\n\nBacking our own people is the obvious answer and the expensive one. Backing the government against the rebellion we started is the oldest trick in the file, and the only one that leaves us looking like a friend when it is over."
 portugal.73.a: "The people we put there"
 portugal.73.b: "The government, and our sympathies"
 portugal.73.c: "Recognise nobody, sell to both"
 portugal.74.t: "The Network Is Rolled Up"
 portugal.74.d: "Ninety days of arrests in a country we thought we understood. The officers we paid for are retired, the customs men are in prison, and the second secretary at the central bank has been on television.\n\n\n\nEverything we built there has to be built again, and this time they are looking."
 portugal.74.a: "They were always going to notice eventually"
 POR_operation_falsa_bandeira_unlocked_tt: "Unlocks the §YFalse Flag§! operation against any state where we hold a network"
 POR_comunidade_lusofona_idea: "Community of Portuguese Language Countries"
 POR_comunidade_lusofona_idea_desc: "Nine states, two hundred and eighty million people and one language, held together by a secretariat in Lisbon with a budget smaller than a mid-sized municipality. It is worth something in trade and almost nothing in obligation.\n\n\n\nIt is also the reason our counter-intelligence services know which embassy to watch. Everyone who joins is told, politely, what the arrangement has historically been."
